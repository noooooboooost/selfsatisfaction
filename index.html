<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カプレカ数＆カプレカールーチン シミュレータ（無限桁対応版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for browser-side JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
      body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('routine');
            
            // Routine Tab States
            const [inputNum, setInputNum] = useState('3276');
            const [steps, setSteps] = useState([]);
            const [finishReason, setFinishReason] = useState('');
            const [message, setMessage] = useState('');

            // Run Kaprekar Routine (Infinite Digits Support)
            const runRoutine = (valStr) => {
                let current = valStr.trim();
                const len = current.length;
                
                if (len < 2) {
                    setMessage('2桁以上の数値を入力してください。');
                    setSteps([]);
                    setFinishReason('');
                    return;
                }

                if (!/^\d+$/.test(current)) {
                    setMessage('半角の数字のみを入力してください。');
                    setSteps([]);
                    setFinishReason('');
                    return;
                }

                if (new Set(current.split('')).size === 1) {
                    setMessage('すべての桁が同じ数字の場合、引き算が0になってしまうため計算できません。（例: 1111など）');
                    setSteps([]);
                    setFinishReason('');
                    return;
                }

                setMessage('');
                const history = [];
                let currentNumStr = current;
                let reason = '';

                for (let i = 0; i < 100; i++) {
                    while (currentNumStr.length < len) currentNumStr = '0' + currentNumStr;

                    const digits = currentNumStr.split('').map(Number);
                    const asc = [...digits].sort((a, b) => a - b).join('');
                    const desc = [...digits].sort((a, b) => b - a).join('');

                    const ascNum = parseInt(asc, 10);
                    const descNum = parseInt(desc, 10);
                    const diff = descNum - ascNum;

                    const nextNumStr = String(diff).padStart(len, '0');

                    history.push({
                        step: i + 1,
                        asc,
                        desc,
                        diff,
                        formattedDiff: nextNumStr
                    });

                    // 終了判定
                    if (diff === 0) {
                        reason = '引き算の結果が「0」になったため終了しました。';
                        break;
                    }
                    if (currentNumStr === nextNumStr) {
                        reason = `数値が変化しなくなったため、カプレカ数（または定点）「${nextNumStr}」に収束しました。`;
                        break;
                    }

                    // ループ検出
                    const loopIndex = history.findIndex((h, idx) => h.formattedDiff === nextNumStr && idx < history.length - 1);
                    if (loopIndex !== -1) {
                        reason = `同じ数値の循環ループ（周期ルーチン）に入ったため計算を終了しました。`;
                        break;
                    }

                    currentNumStr = nextNumStr;
                }

                if (!reason) {
                    reason = '100ステップに到達したため計算を終了しました。';
                }

                setSteps(history);
                setFinishReason(reason);
            };

            useEffect(() => {
                runRoutine(inputNum);
            }, []);

            return (
                <div className="max-w-2xl mx-auto px-4 py-8">
                    <header className="text-center mb-8">
                        <h1 className="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent mb-2">
                            カプレカ数＆ルーチン シミュレータ
                        </h1>
                        <p className="text-slate-400 text-sm">何桁でも計算できる無限桁対応版</p>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="flex bg-slate-800 p-1 rounded-xl mb-6 border border-slate-700">
                        <button
                            onClick={() => setActiveTab('routine')}
                            className={`flex-1 py-2.5 text-sm font-medium rounded-lg transition-all ${
                                activeTab === 'routine'
                                    ? 'bg-indigo-600 text-white shadow-lg'
                                    : 'text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            ルーチン計算
                        </button>
                        <button
                            onClick={() => setActiveTab('about')}
                            className={`flex-1 py-2.5 text-sm font-medium rounded-lg transition-all ${
                                activeTab === 'about'
                                    ? 'bg-indigo-600 text-white shadow-lg'
                                    : 'text-slate-400 hover:text-slate-200'
                            }`}
                        >
                            カプレカ数とは？
                        </button>
                    </div>

                    {activeTab === 'routine' && (
                        <div className="space-y-6">
                            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                                <label className="block text-sm font-medium text-slate-300 mb-2">
                                    好きな桁数の数字を入力（2桁以上）
                                </label>
                                <div className="flex gap-3">
                                    <input
                                        type="text"
                                        value={inputNum}
                                        onChange={(e) => setInputNum(e.target.value)}
                                        placeholder="例: 3276, 58219"
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-lg text-slate-100 focus:outline-none focus:border-indigo-500"
                                    />
                                    <button
                                        onClick={() => runRoutine(inputNum)}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30"
                                    >
                                        実行
                                    </button>
                                </div>
                                {message && (
                                    <p className="mt-3 text-amber-400 text-sm bg-amber-500/10 p-3 rounded-lg border border-amber-500/20">
                                        {message}
                                    </p>
                                )}
                            </div>

                            {steps.length > 0 && (
                                <div className="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl">
                                    <div className="p-4 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
                                        <h2 className="font-semibold text-slate-200">計算ステップ ({steps.length} 段階)</h2>
                                    </div>
                                    <div className="divide-y divide-slate-700/50">
                                        {steps.map((s) => (
                                            <div key={s.step} className="p-4 flex items-center justify-between hover:bg-slate-700/30 transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <span className="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-indigo-400">
                                                        {s.step}
                                                    </span>
                                                    <div className="text-sm font-mono">
                                                        <span className="text-slate-400">{s.desc}</span>
                                                        <span className="text-slate-600 mx-2">-</span>
                                                        <span className="text-slate-400">{s.asc}</span>
                                                    </div>
                                                </div>
                                                <div className="font-mono font-bold text-indigo-300 text-lg">
                                                    = {s.formattedDiff}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    {finishReason && (
                                        <div className="p-4 bg-indigo-950/40 border-t border-slate-700 text-indigo-300 text-sm flex items-center gap-2">
                                            <span className="font-bold">【終了理由】</span> {finishReason}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'about' && (
                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4 text-slate-300 text-sm leading-relaxed shadow-xl">
                            <h2 className="text-lg font-bold text-slate-100">カプレカ数とは？</h2>
                            <p>
                                任意の数字の桁を並べ替えて作った「最大値」と「最小値」の差を計算する操作（カプレカールーチン）を繰り返すと、特定の数（あるいはループ）に収束する性質があります。
                            </p>
                            <p>
                                この無限桁対応版アプリでは、3桁や4桁だけでなく、5桁、6桁など、どんな桁数の数字を入力しても自動で桁数を合わせて計算を実行できます。
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
