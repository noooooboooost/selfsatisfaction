<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ブロック崩し</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 box-border">

    <!-- 上部: HUD（スコア・ライフ等） -->
    <div class="w-full max-w-sm flex justify-between items-center px-3 py-1 bg-slate-800/80 rounded-lg text-xs font-bold border border-slate-700">
        <div class="flex gap-3">
            <div>SCORE: <span id="score" class="text-amber-400 text-sm">0</span></div>
            <div>HIGH: <span id="highscore" class="text-slate-400">0</span></div>
        </div>
        <div class="flex items-center gap-1">
            <span>LIFE:</span>
            <div id="lives" class="flex gap-1 text-red-500 text-sm">♥♥♥</div>
        </div>
    </div>

    <!-- 中央: ゲームキャンバス (上部の空間を極力削って配置) -->
    <div class="relative w-full max-w-sm flex justify-center items-center flex-grow py-1">
        <canvas id="gameCanvas" class="bg-slate-950 rounded-xl border-2 border-slate-700 shadow-xl max-h-full"></canvas>
        
        <!-- スタート / ゲームオーバー オーバーレイ -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/85 rounded-xl flex flex-col items-center justify-center p-4 text-center">
            <h1 id="overlay-title" class="text-2xl font-extrabold text-amber-400 mb-2">BREAKOUT</h1>
            <p id="overlay-msg" class="text-xs text-slate-300 mb-4">画面下のボタンでパドルを操作！<br>発射ボタンで玉をスタートします</p>
            <button id="start-btn" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold px-6 py-2.5 rounded-full text-sm shadow-lg transition">
                ゲームスタート
            </button>
        </div>
    </div>

    <!-- 下部: 左右移動・発射コントローラー -->
    <div class="w-full max-w-sm grid grid-cols-3 gap-2 pt-1 pb-2">
        <button id="btn-left" class="bg-slate-800 active:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xl shadow-md border border-slate-700 active:scale-95 transition-transform flex justify-center items-center">
            ◀
        </button>
        <button id="btn-fire" class="bg-amber-500 active:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl text-sm shadow-md active:scale-95 transition-transform flex justify-center items-center">
            🚀 発射
        </button>
        <button id="btn-right" class="bg-slate-800 active:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xl shadow-md border border-slate-700 active:scale-95 transition-transform flex justify-center items-center">
            ▶
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // キャンバスサイズ設定（縦長スマホ画面向け）
        const CANVAS_WIDTH = 320;
        const CANVAS_HEIGHT = 420;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // ゲーム状態変数
        let score = 0;
        let highscore = localStorage.getItem('breakout_highscore') || 0;
        let lives = 3;
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', 'CLEAR'

        document.getElementById('highscore').innerText = highscore;

        // パドル設定
        const paddle = {
            width: 60,
            height: 10,
            x: (CANVAS_WIDTH - 60) / 2,
            y: CANVAS_HEIGHT - 20,
            speed: 6,
            dx: 0
        };

        // ボール設定
        const ball = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT - 30,
            radius: 5,
            speed: 4,
            dx: 0,
            dy: 0,
            attached: true
        };

        // ブロック設定（最上段との隙間を詰めるため topOffset を 8 に最小化）
        const brickConfig = {
            rows: 5,
            cols: 7,
            padding: 4,
            topOffset: 8,
            leftOffset: 8
        };

        // 各列の幅を自動計算
        const brickWidth = (CANVAS_WIDTH - (brickConfig.leftOffset * 2) - (brickConfig.padding * (brickConfig.cols - 1))) / brickConfig.cols;
        const brickHeight = 12;

        const brickColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];

        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let r = 0; r < brickConfig.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    bricks[r][c] = {
                        x: brickConfig.leftOffset + c * (brickWidth + brickConfig.padding),
                        y: brickConfig.topOffset + r * (brickHeight + brickConfig.padding),
                        status: 1,
                        color: brickColors[r % brickColors.length]
                    };
                }
            }
        }

        // ボールリセット（パドルの上に取り付け）
        function resetBall() {
            ball.attached = true;
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius - 1;
            ball.dx = 0;
            ball.dy = 0;
        }

        // ボール発射
        function fireBall() {
            if (ball.attached && gameState === 'PLAYING') {
                ball.attached = false;
                const angle = (Math.random() * 60 - 30) * (Math.PI / 180); // -30度〜30度のランダム角
                ball.dx = ball.speed * Math.sin(angle);
                ball.dy = -ball.speed * Math.cos(angle);
            }
        }

        // 入力制御
        let moveLeft = false;
        let moveRight = false;

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnFire = document.getElementById('btn-fire');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');

        // タッチ / ボタン操作イベント
        const addControlListeners = (element, startFn, endFn) => {
            element.addEventListener('touchstart', (e) => { e.preventDefault(); startFn(); });
            element.addEventListener('touchend', (e) => { e.preventDefault(); endFn(); });
            element.addEventListener('mousedown', startFn);
            element.addEventListener('mouseup', endFn);
            element.addEventListener('mouseleave', endFn);
        };

        addControlListeners(btnLeft, () => moveLeft = true, () => moveLeft = false);
        addControlListeners(btnRight, () => moveRight = true, () => moveRight = false);

        btnFire.addEventListener('click', () => {
            if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
                startGame();
            } else {
                fireBall();
            }
        });

        startBtn.addEventListener('click', startGame);

        // キーボード操作
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
            if (e.key === ' ' || e.key === 'ArrowUp') {
                if (gameState !== 'PLAYING') startGame();
                else fireBall();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });

        function startGame() {
            score = 0;
            lives = 3;
            gameState = 'PLAYING';
            paddle.x = (CANVAS_WIDTH - paddle.width) / 2;
            updateHUD();
            initBricks();
            resetBall();
            overlay.classList.add('hidden');
        }

        function updateHUD() {
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = '♥'.repeat(lives);
        }

        // 描画処理
        function drawPaddle() {
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 4);
            ctx.fill();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f1f5f9';
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, brickWidth, brickHeight, 2);
                        ctx.fill();
                    }
                }
            }
        }

        // 衝突判定
        function collisionDetection() {
            let activeBricks = 0;
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        activeBricks++;
                        if (
                            ball.x + ball.radius > b.x &&
                            ball.x - ball.radius < b.x + brickWidth &&
                            ball.y + ball.radius > b.y &&
                            ball.y - ball.radius < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            updateHUD();

                            if (score > highscore) {
                                highscore = score;
                                localStorage.setItem('breakout_highscore', highscore);
                                document.getElementById('highscore').innerText = highscore;
                            }
                        }
                    }
                }
            }

            if (activeBricks === 0 && gameState === 'PLAYING') {
                gameState = 'CLEAR';
                showOverlay('GAME CLEAR! 🎉', `クリアスコア: ${score}`);
            }
        }

        function showOverlay(title, msg) {
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-msg').innerText = msg;
            startBtn.innerText = 'もう一度プレイ';
            overlay.classList.remove('hidden');
        }

        // 移動＆更新処理
        function update() {
            if (gameState === 'PLAYING') {
                // パドル移動
                if (moveLeft && paddle.x > 0) {
                    paddle.x -= paddle.speed;
                }
                if (moveRight && paddle.x < CANVAS_WIDTH - paddle.width) {
                    paddle.x += paddle.speed;
                }

                // ボールが発射前ならパドルに固定
                if (ball.attached) {
                    ball.x = paddle.x + paddle.width / 2;
                } else {
                    ball.x += ball.dx;
                    ball.y += ball.dy;

                    // 左右壁反射
                    if (ball.x + ball.radius > CANVAS_WIDTH || ball.x - ball.radius < 0) {
                        ball.dx = -ball.dx;
                    }

                    // 上壁反射
                    if (ball.y - ball.radius < 0) {
                        ball.dy = -ball.dy;
                    }

                    // パドル反射
                    if (
                        ball.y + ball.radius >= paddle.y &&
                        ball.x >= paddle.x &&
                        ball.x <= paddle.x + paddle.width
                    ) {
                        // パドル中央からの距離に応じて反射角を変える
                        let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        let angle = hitPoint * (Math.PI / 3); // 最大60度

                        ball.dx = ball.speed * Math.sin(angle);
                        ball.dy = -ball.speed * Math.cos(angle);
                    }

                    // 落下（アウト）
                    if (ball.y + ball.radius > CANVAS_HEIGHT) {
                        lives--;
                        updateHUD();
                        if (lives <= 0) {
                            gameState = 'GAMEOVER';
                            showOverlay('GAME OVER 💀', `最終スコア: ${score}`);
                        } else {
                            resetBall();
                        }
                    }
                }

                collisionDetection();
            }
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            drawBricks();
            drawPaddle();
            drawBall();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // 初期化
        initBricks();
        gameLoop();
    </script>
</body>
</html>
