<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ネオン・ブロック崩し (Breakout Neon)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        canvas {
            touch-action: none;
        }
        /* ネオンテイストのボタン効果 */
        .neon-border {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(147, 51, 234, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 select-none">

    <!-- 1. ヘッダー / ステータス表示 -->
    <div class="w-full max-w-md flex flex-col items-center gap-2 mt-1">
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-amber-400 neon-text">
            ⚡ BREAKOUT NEON
        </h1>

        <!-- スコア・ライフ・ハイスコアバー -->
        <div class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center text-xs sm:text-sm font-bold shadow-lg">
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">SCORE:</span>
                <span id="score" class="text-cyan-400 font-mono text-base">0</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">HIGH:</span>
                <span id="highscore" class="text-amber-400 font-mono text-base">0</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">LIVES:</span>
                <div id="lives-container" class="flex gap-1 text-red-500 text-sm">
                    ❤️❤️❤️
                </div>
            </div>
        </div>
    </div>

    <!-- 2. ゲームキャンバス & オーバーレイ -->
    <div class="relative w-full max-w-md my-auto flex justify-center items-center">
        <canvas id="gameCanvas" width="400" height="520" class="bg-slate-900/90 rounded-2xl border-2 border-slate-800 shadow-2xl w-full h-auto max-h-[65vh] neon-border"></canvas>

        <!-- スタート / ポーズ / リザルト用モーダル -->
        <div id="modal" class="absolute inset-0 bg-black/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center space-y-4">
            <h2 id="modal-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">
                BREAKOUT NEON
            </h2>
            <p id="modal-desc" class="text-xs text-slate-300 leading-relaxed max-w-xs">
                パドルを操作してボールを打ち返し、ブロックを全て破壊しよう！<br>
                落ちてくるパワーアップアイテムを獲得すると有利になります。
            </p>
            <button id="start-btn" onclick="startGame()" class="w-full max-w-xs bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-95 text-white font-black py-3.5 px-6 rounded-xl shadow-lg transition-all text-sm tracking-wider">
                ▶ ゲームスタート
            </button>
        </div>
    </div>

    <!-- 3. スマホ用コントローラー（下部固定） -->
    <div class="w-full max-w-md space-y-2 mb-1">
        <div class="grid grid-cols-3 gap-2">
            <button id="btn-left" class="bg-slate-800 active:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-4 rounded-xl text-xl shadow-md active:scale-95 transition-all flex items-center justify-center">
                ◀ LEFT
            </button>
            <button id="btn-action" class="bg-indigo-600 active:bg-indigo-500 text-white font-bold py-4 rounded-xl text-xs shadow-md active:scale-95 transition-all flex flex-col items-center justify-center">
                <span class="text-sm">🚀 LAUNCH</span>
                <span class="text-[10px] text-indigo-200 font-normal">/ LASER</span>
            </button>
            <button id="btn-right" class="bg-slate-800 active:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-4 rounded-xl text-xl shadow-md active:scale-95 transition-all flex items-center justify-center">
                RIGHT ▶
            </button>
        </div>
    </div>

    <!-- ゲームロジックScript -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 定数設定
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 520;
        const BRICK_ROWS = 6;
        const BRICK_COLS = 7;
        const BRICK_PADDING = 6;
        const BRICK_OFFSET_TOP = 50;
        const BRICK_OFFSET_LEFT = 12;
        const BRICK_WIDTH = (CANVAS_WIDTH - (BRICK_OFFSET_LEFT * 2) - (BRICK_PADDING * (BRICK_COLS - 1))) / BRICK_COLS;
        const BRICK_HEIGHT = 16;

        // 行ごとのブロック定義（色・ポイント・耐久値）
        const BRICK_TYPES = [
            { color: '#ef4444', points: 50, hp: 2 }, // 赤: 耐久2
            { color: '#f97316', points: 30, hp: 1 }, // オレンジ
            { color: '#eab308', points: 20, hp: 1 }, // 黄
            { color: '#22c55e', points: 15, hp: 1 }, // 緑
            { color: '#06b6d4', points: 10, hp: 1 }, // シアン
            { color: '#a855f7', points: 5,  hp: 1 }  // 紫
        ];

        // アイテムタイプ定義
        const POWERUP_TYPES = [
            { type: 'WIDE', color: '#3b82f6', icon: '🏓', label: 'Wide' },
            { type: 'MULTI', color: '#ec4899', icon: '🔴', label: 'Multi' },
            { type: 'LASER', color: '#eab308', icon: '🔫', label: 'Laser' },
            { type: 'SLOW', color: '#10b981', icon: '🐢', label: 'Slow' }
        ];

        // ゲーム状態変数
        let score = 0;
        let lives = 3;
        let highscore = localStorage.getItem('breakout_highscore') || 0;
        let isGameRunning = false;
        let isBallAttached = true;
        let animationId = null;

        // パドル
        const paddle = {
            width: 75,
            height: 11,
            x: (CANVAS_WIDTH - 75) / 2,
            y: CANVAS_HEIGHT - 35,
            speed: 7,
            dx: 0,
            hasLaser: false,
            laserTimer: 0,
            wideTimer: 0
        };

        // ボール配列 (マルチボール対応)
        let balls = [];
        // ブロック配列
        let bricks = [];
        // パワーアップドロップ配列
        let powerups = [];
        // レーザー弾配列
        let lasers = [];
        // 破片パーティクル配列
        let particles = [];

        // ハイスコア表示
        document.getElementById('highscore').innerText = highscore;

        // --- ブロック初期化 ---
        function initBricks() {
            bricks = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[r] = [];
                const type = BRICK_TYPES[r];
                for (let c = 0; c < BRICK_COLS; c++) {
                    bricks[r][c] = {
                        x: BRICK_OFFSET_LEFT + c * (BRICK_WIDTH + BRICK_PADDING),
                        y: BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
                        hp: type.hp,
                        maxHp: type.hp,
                        color: type.color,
                        points: type.points,
                        status: 1
                    };
                }
            }
        }

        // --- ボール作成 ---
        function createBall(x, y, vx, vy) {
            return {
                x: x,
                y: y,
                radius: 5,
                speed: 5.5,
                vx: vx || 0,
                vy: vy || -5.5
            };
        }

        // --- ゲームリセット ---
        function resetGame() {
            score = 0;
            lives = 3;
            updateUI();
            initBricks();
            resetPaddleAndBall();
            powerups = [];
            lasers = [];
            particles = [];
        }

        function resetPaddleAndBall() {
            paddle.width = 75;
            paddle.x = (CANVAS_WIDTH - paddle.width) / 2;
            paddle.hasLaser = false;
            paddle.laserTimer = 0;
            paddle.wideTimer = 0;

            isBallAttached = true;
            balls = [createBall(paddle.x + paddle.width / 2, paddle.y - 6, 0, -5.5)];
        }

        // UI表示の更新
        function updateUI() {
            document.getElementById('score').innerText = score;
            const hearts = '❤️'.repeat(Math.max(0, lives));
            document.getElementById('lives-container').innerText = hearts || '💀';
        }

        // --- パーティクルエフェクト ---
        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    life: 0.04
                });
            }
        }

        // --- パワーアップドロップ作成 ---
        function spawnPowerup(x, y) {
            if (Math.random() < 0.25) { // 25%の確率でドロップ
                const pType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
                powerups.push({
                    x: x,
                    y: y,
                    vy: 2,
                    type: pType.type,
                    color: pType.color,
                    icon: pType.icon
                });
            }
        }

        // --- 発射・アクション ---
        function launchBall() {
            if (isBallAttached && balls.length > 0) {
                isBallAttached = false;
                const angle = (Math.random() * 0.4 - 0.2); // わずかに角度をつける
                balls[0].vx = balls[0].speed * Math.sin(angle);
                balls[0].vy = -balls[0].speed * Math.cos(angle);
            } else if (paddle.hasLaser) {
                // レーザー発射
                lasers.push({ x: paddle.x + 10, y: paddle.y, vy: -9 });
                lasers.push({ x: paddle.x + paddle.width - 10, y: paddle.y, vy: -9 });
            }
        }

        // --- 入力キーボード＆タッチ状態処理 ---
        const keys = { left: false, right: false };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') launchBall();
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        // スマホ用ボタンイベント
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnAction = document.getElementById('btn-action');

        const bindTouch = (elem, onStart, onEnd) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
            elem.addEventListener('mousedown', (e) => { e.preventDefault(); onStart(); });
            elem.addEventListener('mouseup', (e) => { e.preventDefault(); onEnd(); });
        };

        bindTouch(btnLeft, () => keys.left = true, () => keys.left = false);
        bindTouch(btnRight, () => keys.right = true, () => keys.right = false);
        btnAction.addEventListener('click', launchBall);

        // --- メインアップデートロジック ---
        function update() {
            // パドル移動
            if (keys.left && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            if (keys.right && paddle.x + paddle.width < CANVAS_WIDTH) {
                paddle.x += paddle.speed;
            }

            // ボールがパドルにくっついている状態
            if (isBallAttached && balls.length > 0) {
                balls[0].x = paddle.x + paddle.width / 2;
                balls[0].y = paddle.y - 6;
            }

            // タイマー管理（パワーアップ効果時間）
            if (paddle.wideTimer > 0) {
                paddle.wideTimer--;
                if (paddle.wideTimer === 0) paddle.width = 75;
            }
            if (paddle.laserTimer > 0) {
                paddle.laserTimer--;
                if (paddle.laserTimer === 0) paddle.hasLaser = false;
            }

            // レーザー弾の移動・当たり判定
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.y += l.vy;

                // 画面外消滅
                if (l.y < 0) {
                    lasers.splice(i, 1);
                    continue;
                }

                // ブロックとの衝突
                let hit = false;
                for (let r = 0; r < BRICK_ROWS; r++) {
                    for (let c = 0; c < BRICK_COLS; c++) {
                        const b = bricks[r][c];
                        if (b.status > 0 && l.x > b.x && l.x < b.x + BRICK_WIDTH && l.y > b.y && l.y < b.y + BRICK_HEIGHT) {
                            b.hp--;
                            createParticles(l.x, l.y, b.color);
                            if (b.hp <= 0) {
                                b.status = 0;
                                score += b.points;
                                spawnPowerup(b.x + BRICK_WIDTH / 2, b.y + BRICK_HEIGHT);
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) break;
                }
                if (hit) lasers.splice(i, 1);
            }

            // パワーアップアイテムの落下・獲得
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;

                // パドルで獲得
                if (p.y + 10 >= paddle.y && p.y - 10 <= paddle.y + paddle.height &&
                    p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
                    
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                    continue;
                }

                // 画面外へ落下
                if (p.y > CANVAS_HEIGHT) {
                    powerups.splice(i, 1);
                }
            }

            // ボールの移動・反射
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                if (isBallAttached) continue;

                b.x += b.vx;
                b.y += b.vy;

                // 左右の壁反射
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.vx = -b.vx;
                } else if (b.x + b.radius > CANVAS_WIDTH) {
                    b.x = CANVAS_WIDTH - b.radius;
                    b.vx = -b.vx;
                }

                // 天井反射
                if (b.y - b.radius < 0) {
                    b.y = b.radius;
                    b.vy = -b.vy;
                }

                // パドルとの反射（当たった位置で反射角を変える）
                if (b.y + b.radius >= paddle.y && b.y - b.radius <= paddle.y + paddle.height &&
                    b.x >= paddle.x && b.x <= paddle.x + paddle.width && b.vy > 0) {
                    
                    // パドル中心からの相対距離 (-1 ~ 1)
                    const hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    const maxAngle = Math.PI / 3; // 最大60度
                    const bounceAngle = hitPoint * maxAngle;

                    const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                    b.vx = speed * Math.sin(bounceAngle);
                    b.vy = -speed * Math.cos(bounceAngle);
                }

                // ブロックとの衝突判定
                for (let r = 0; r < BRICK_ROWS; r++) {
                    for (let c = 0; c < BRICK_COLS; c++) {
                        const br = bricks[r][c];
                        if (br.status > 0) {
                            if (b.x + b.radius > br.x && b.x - b.radius < br.x + BRICK_WIDTH &&
                                b.y + b.radius > br.y && b.y - b.radius < br.y + BRICK_HEIGHT) {
                                
                                b.vy = -b.vy; // 上下反射
                                br.hp--;
                                createParticles(b.x, b.y, br.color);

                                // ボール速度を徐々にアップ
                                b.vx *= 1.015;
                                b.vy *= 1.015;

                                if (br.hp <= 0) {
                                    br.status = 0;
                                    score += br.points;
                                    spawnPowerup(br.x + BRICK_WIDTH / 2, br.y + BRICK_HEIGHT);
                                }
                                updateUI();
                                break;
                            }
                        }
                    }
                }

                // 底面に落下
                if (b.y - b.radius > CANVAS_HEIGHT) {
                    balls.splice(i, 1);
                }
            }

            // すべてのボールが落ちた場合
            if (balls.length === 0 && !isBallAttached) {
                lives--;
                updateUI();
                if (lives <= 0) {
                    gameOver();
                } else {
                    resetPaddleAndBall();
                }
            }

            // クリア判定
            let allCleared = true;
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    if (bricks[r][c].status > 0) {
                        allCleared = false;
                        break;
                    }
                }
            }
            if (allCleared && isGameRunning) {
                gameVictory();
            }

            // パーティクルの更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }
        }

        // --- パワーアップ適用 ---
        function applyPowerup(type) {
            score += 50;
            updateUI();
            if (type === 'WIDE') {
                paddle.width = 110;
                paddle.wideTimer = 600; // 約10秒
            } else if (type === 'MULTI') {
                const currentCount = balls.length;
                for (let i = 0; i < currentCount; i++) {
                    const base = balls[i] || { x: paddle.x + paddle.width / 2, y: paddle.y - 10 };
                    balls.push(createBall(base.x, base.y, 4, -4));
                    balls.push(createBall(base.x, base.y, -4, -4));
                }
            } else if (type === 'LASER') {
                paddle.hasLaser = true;
                paddle.laserTimer = 500;
            } else if (type === 'SLOW') {
                balls.forEach(b => {
                    b.vx *= 0.65;
                    b.vy *= 0.65;
                });
            }
        }

        // --- 描画ロジック ---
        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // ブロックの描画
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const b = bricks[r][c];
                    if (b.status > 0) {
                        ctx.fillStyle = b.color;
                        ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1.0; // ダメージ時半透明
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, BRICK_WIDTH, BRICK_HEIGHT, 4);
                        ctx.fill();

                        // ブロック光沢
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.fillRect(b.x, b.y, BRICK_WIDTH, 3);
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            // パドルの描画
            ctx.fillStyle = paddle.hasLaser ? '#f59e0b' : '#3b82f6';
            ctx.shadowColor = paddle.hasLaser ? '#f59e0b' : '#3b82f6';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
            ctx.fill();
            ctx.shadowBlur = 0;

            // レーザー銃口演出
            if (paddle.hasLaser) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(paddle.x + 8, paddle.y - 3, 4, 4);
                ctx.fillRect(paddle.x + paddle.width - 12, paddle.y - 3, 4, 4);
            }

            // レーザー弾の描画
            ctx.fillStyle = '#ef4444';
            lasers.forEach(l => {
                ctx.fillRect(l.x - 1.5, l.y, 3, 8);
            });

            // ボールの描画
            balls.forEach(b => {
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // パワーアップアイテムの描画
            powerups.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.icon, p.x, p.y + 3);
            });

            // パーティクルの描画
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.alpha;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        // --- ゲームループ ---
        function loop() {
            if (isGameRunning) {
                update();
                draw();
                animationId = requestAnimationFrame(loop);
            }
        }

        // --- ゲームオーバー・クリア処理 ---
        function checkHighScore() {
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('breakout_highscore', highscore);
                document.getElementById('highscore').innerText = highscore;
            }
        }

        function gameOver() {
            isGameRunning = false;
            checkHighScore();
            showModal('GAME OVER', `最終スコア: ${score} 点<br>ゲームオーバー！もう一度挑戦しよう。`, '🔄 リトライ');
        }

        function gameVictory() {
            isGameRunning = false;
            checkHighScore();
            showModal('STAGE CLEAR!', `おめでとうございます！<br>全ブロック破壊完了！ スコア: ${score} 点`, '🎉 もう一度遊ぶ');
        }

        function showModal(title, desc, btnText) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerHTML = desc;
            document.getElementById('start-btn').innerText = btnText;
            document.getElementById('modal').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('modal').classList.add('hidden');
            resetGame();
            isGameRunning = true;
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        // 初期描画
        initBricks();
        resetPaddleAndBall();
        draw();
    </script>
</body>
</html>
