<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ブロック崩し (Breakout)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* スマホでの誤動作防止（長押し選択やスクロールの禁止） */
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #0f172a; /* Tailwind slate-900 */
    }
    /* ボタンタップ時の視覚的フィードバック */
    .btn-touch:active {
      transform: scale(0.95);
      filter: brightness(1.2);
    }
  </style>
</head>
<body class="h-[100dvh] w-screen text-slate-100 flex flex-col justify-between items-center p-2 select-none overflow-hidden">

  <!-- ==================== 1. ヘッダー（スコア / ライフ） ==================== -->
  <header class="w-full max-w-sm flex justify-between items-center bg-slate-800/90 border border-slate-700/80 px-3 py-1.5 rounded-xl text-xs font-bold shadow-md shrink-0">
    <div class="flex items-center gap-1.5">
      <span class="text-slate-400">SCORE:</span>
      <span id="score" class="text-amber-400 text-sm font-mono">0</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="text-slate-400">HIGH:</span>
      <span id="highscore" class="text-emerald-400 text-sm font-mono">0</span>
    </div>
    <div class="flex items-center gap-1">
      <span class="text-slate-400">LIFE:</span>
      <div id="lives-container" class="flex gap-0.5 text-red-500 text-sm">
        <span>❤️</span><span>❤️</span><span>❤️</span>
      </div>
    </div>
  </header>

  <!-- ==================== 2. プレイ画面（Canvas + オーバーレイ） ==================== -->
  <main class="relative w-full max-w-sm my-1 flex-1 min-h-0 flex items-center justify-center">
    <!-- キャンバス本体 -->
    <canvas id="game-canvas" class="w-full h-full bg-slate-950 rounded-xl border border-slate-700/60 shadow-2xl block object-contain"></canvas>

    <!-- スタート / ゲームオーバー / クリア 用オーバーレイ -->
    <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center p-4 text-center z-10 transition-opacity duration-200">
      <h1 id="overlay-title" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-red-500 mb-1">
        BLOCK BREAKOUT
      </h1>
      <p id="overlay-msg" class="text-xs text-slate-300 mb-4 leading-relaxed">
        下部のコントローラーまたはキーボードで操作！<br>「発射」ボタンでゲーム開始
      </p>
      <button id="start-btn" onclick="handleOverlayButtonClick()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-2.5 px-6 rounded-xl text-sm shadow-lg border border-indigo-400/30 active:scale-95 transition-all">
        ゲームスタート 🚀
      </button>
    </div>
  </main>

  <!-- ==================== 3. コントローラー（スマホ向け操作ボタン） ==================== -->
  <footer class="w-full max-w-sm shrink-0 mb-1">
    <div class="grid grid-cols-3 gap-2">
      <!-- 左移動ボタン -->
      <button id="btn-left" class="btn-touch bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-black py-3 rounded-xl text-xl flex items-center justify-center shadow-lg active:bg-indigo-900/50">
        ◀
      </button>

      <!-- 発射ボタン -->
      <button id="btn-launch" class="btn-touch bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-extrabold py-3 rounded-xl text-xs flex flex-col items-center justify-center shadow-lg active:scale-95 border border-amber-400/30">
        <span class="text-base leading-none">🚀</span>
        <span class="mt-0.5">発射</span>
      </button>

      <!-- 右移動ボタン -->
      <button id="btn-right" class="btn-touch bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-black py-3 rounded-xl text-xl flex items-center justify-center shadow-lg active:bg-indigo-900/50">
        ▶
      </button>
    </div>
  </footer>

  <!-- ==================== JavaScript ゲームロジック ==================== -->
  <script>
    // --- Canvas & Context ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const livesContainer = document.getElementById('lives-container');
    const overlay = document.getElementById('game-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    // ゲーム定数・変数
    const GAME_WIDTH = 360;  // 内部論理解像度 幅
    const GAME_HEIGHT = 500; // 内部論理解像度 高さ
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // ゲーム状態 (INIT, READY, PLAYING, GAMEOVER, CLEAR)
    let gameState = 'INIT';

    let score = 0;
    let highscore = parseInt(localStorage.getItem('breakout_highscore') || '0', 10);
    let lives = 3;

    // パドル設定
    const paddle = {
      width: 65,
      height: 10,
      x: (GAME_WIDTH - 65) / 2,
      y: GAME_HEIGHT - 25,
      speed: 6,
      dx: 0
    };

    // ボール設定
    const ball = {
      x: 0,
      y: 0,
      radius: 5,
      speed: 4.5,
      dx: 0,
      dy: 0,
      isStuck: true // パドルに固定されているか
    };

    // ブロック設定
    const brickConfig = {
      rows: 5,
      cols: 7,
      padding: 6,
      offsetTop: 40,
      offsetLeft: 12,
      width: 0, // 動的に計算
      height: 14
    };
    // ブロック幅の計算: (全体幅 - 左右余白 - ブロック間隙間) / 列数
    brickConfig.width = (GAME_WIDTH - (brickConfig.offsetLeft * 2) - (brickConfig.padding * (brickConfig.cols - 1))) / brickConfig.cols;

    // ブロックの色と得点設定
    const brickTheme = [
      { color: '#ef4444', points: 50 }, // 赤
      { color: '#f97316', points: 40 }, // オレンジ
      { color: '#eab308', points: 30 }, // 黄
      { color: '#22c55e', points: 20 }, // 緑
      { color: '#06b6d4', points: 10 }  // シアン
    ];

    let bricks = [];

    // --- 入力キー/ボタン状態 ---
    const keys = {
      left: false,
      right: false
    };

    // ハイスコア初期表示
    highscoreEl.innerText = highscore;

    // ==================== 初期化・生成系関数 ====================

    // ブロック配列の生成
    function createBricks() {
      bricks = [];
      for (let r = 0; r < brickConfig.rows; r++) {
        bricks[r] = [];
        for (let c = 0; c < brickConfig.cols; c++) {
          const x = brickConfig.offsetLeft + c * (brickConfig.width + brickConfig.padding);
          const y = brickConfig.offsetTop + r * (brickConfig.height + brickConfig.padding);
          bricks[r][c] = {
            x: x,
            y: y,
            status: 1, // 1: 生存, 0: 破壊
            color: brickTheme[r].color,
            points: brickTheme[r].points
          };
        }
      }
    }

    // ボールとパドルを初期位置（発射待機）にリセット
    function resetBallAndPaddle() {
      paddle.x = (GAME_WIDTH - paddle.width) / 2;
      ball.isStuck = true;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius - 1;
      ball.dx = 0;
      ball.dy = 0;
    }

    // ゲーム完全リセット（NEW GAME）
    function initGame() {
      score = 0;
      lives = 3;
      updateUI();
      createBricks();
      resetBallAndPaddle();
    }

    // UI表示の更新
    function updateUI() {
      scoreEl.innerText = score;
      highscoreEl.innerText = highscore;

      // ライフのハート表示
      let heartsHtml = '';
      for (let i = 0; i < lives; i++) {
        heartsHtml += '<span>❤️</span>';
      }
      livesContainer.innerHTML = heartsHtml || '<span class="text-slate-600">💀</span>';
    }

    // ==================== ゲームロジック・更新 ====================

    // 玉の発射
    function launchBall() {
      if (!ball.isStuck) return;

      ball.isStuck = false;
      // 初速の角度（少しランダム性を持たせた斜め上）
      const angle = (Math.random() * 40 + 70) * (Math.PI / 180); // 70度〜110度
      const direction = Math.random() < 0.5 ? 1 : -1;

      ball.dx = ball.speed * Math.cos(angle) * direction;
      ball.dy = -ball.speed * Math.sin(angle);
    }

    // 移動・物理・判定の更新
    function update() {
      if (gameState !== 'PLAYING') return;

      // 1. パドル移動
      if (keys.left) {
        paddle.x -= paddle.speed;
      }
      if (keys.right) {
        paddle.x += paddle.speed;
      }

      // パドル画面端制限
      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.width > GAME_WIDTH) paddle.x = GAME_WIDTH - paddle.width;

      // 2. ボール移動（発射前はパドルに乗る）
      if (ball.isStuck) {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 1;
      } else {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // 壁との衝突判定 (左右)
        if (ball.x - ball.radius <= 0) {
          ball.x = ball.radius;
          ball.dx *= -1;
        } else if (ball.x + ball.radius >= GAME_WIDTH) {
          ball.x = GAME_WIDTH - ball.radius;
          ball.dx *= -1;
        }

        // 天井との衝突判定
        if (ball.y - ball.radius <= 0) {
          ball.y = ball.radius;
          ball.dy *= -1;
        }

        // 3. パドルとの衝突判定
        if (
          ball.dy > 0 &&
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.width
        ) {
          // 打点によって反射角を変化させる
          const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2); // -1.0 〜 1.0
          const maxAngle = 60 * (Math.PI / 180); // 最大60度
          const angle = hitPoint * maxAngle;

          ball.dx = ball.speed * Math.sin(angle);
          ball.dy = -ball.speed * Math.cos(angle);
          ball.y = paddle.y - ball.radius - 1;
        }

        // 4. ブロックとの衝突判定
        let remainingBricks = 0;
        for (let r = 0; r < brickConfig.rows; r++) {
          for (let c = 0; c < brickConfig.cols; c++) {
            const b = bricks[r][c];
            if (b.status === 1) {
              remainingBricks++;
              // AABB衝突判定
              if (
                ball.x + ball.radius > b.x &&
                ball.x - ball.radius < b.x + brickConfig.width &&
                ball.y + ball.radius > b.y &&
                ball.y - ball.radius < b.y + brickConfig.height
              ) {
                b.status = 0;
                ball.dy *= -1; // 簡易反射

                // スコア加算
                score += b.points;
                if (score > highscore) {
                  highscore = score;
                  localStorage.setItem('breakout_highscore', highscore.toString());
                }
                updateUI();
                remainingBricks--;
              }
            }
          }
        }

        // 全ブロック破壊時（ゲームクリア）
        if (remainingBricks === 0) {
          gameClear();
          return;
        }

        // 5. 落下（ミス判定）
        if (ball.y - ball.radius > GAME_HEIGHT) {
          lives--;
          updateUI();
          if (lives <= 0) {
            gameOver();
          } else {
            resetBallAndPaddle();
          }
        }
      }
    }

    // ==================== 描画処理 ====================

    function draw() {
      // 背景クリア
      ctx.fillStyle = '#020617'; // slate-950
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // グリッド風の背景ライン（装飾）
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.15)';
      ctx.lineWidth = 1;
      for (let x = 0; x < GAME_WIDTH; x += 20) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, GAME_HEIGHT);
        ctx.stroke();
      }

      // ブロックの描画
      for (let r = 0; r < brickConfig.rows; r++) {
        for (let c = 0; c < brickConfig.cols; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, brickConfig.width, brickConfig.height, 3);
            ctx.fill();

            // ハイライト（立体感）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(b.x, b.y, brickConfig.width, 2);
          }
        }
      }

      // パドルの描画
      ctx.fillStyle = '#38bdf8'; // sky-400
      ctx.shadowColor = '#0284c7';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 5);
      ctx.fill();
      ctx.shadowBlur = 0; // リセット

      // ボールの描画
      ctx.fillStyle = '#f43f5e'; // rose-500
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0; // リセット

      // 発射前のアニメーションガイド（点線）
      if (ball.isStuck && gameState === 'PLAYING') {
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x, ball.y - 30);
        ctx.stroke();
        ctx.setLineDash([]); // リセット
      }
    }

    // メインアニメーションループ
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ==================== 状態遷移・オーバーレイ制御 ====================

    function showOverlay(title, msg, btnText) {
      overlayTitle.innerText = title;
      overlayMsg.innerHTML = msg;
      startBtn.innerText = btnText;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function handleOverlayButtonClick() {
      if (gameState === 'INIT' || gameState === 'GAMEOVER' || gameState === 'CLEAR') {
        initGame();
        gameState = 'PLAYING';
        hideOverlay();
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      showOverlay(
        'GAME OVER 💀',
        `最終スコア: <b class="text-amber-400 text-base">${score}</b><br>ハイスコア: ${highscore}`,
        'もう一度挑戦 🔄'
      );
    }

    function gameClear() {
      gameState = 'CLEAR';
      showOverlay(
        'STAGE CLEAR! 🎉',
        `素晴らしい！すべてのブロックを破壊しました！<br>スコア: <b class="text-amber-400 text-base">${score}</b>`,
        '次のゲームへ 🚀'
      );
    }

    // ==================== 操作イベント（タッチ＆キーボード） ====================

    // スマホ用ボタンイベントの登録（タッチ長押し・連打・離す動作に対応）
    function setupTouchButton(buttonId, actionStart, actionEnd) {
      const btn = document.getElementById(buttonId);

      const start = (e) => {
        e.preventDefault();
        actionStart();
      };

      const end = (e) => {
        e.preventDefault();
        if (actionEnd) actionEnd();
      };

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });

      // PCマウス操作のフォールバック
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    // 左移動ボタン
    setupTouchButton('btn-left', 
      () => { keys.left = true; }, 
      () => { keys.left = false; }
    );

    // 右移動ボタン
    setupTouchButton('btn-right', 
      () => { keys.right = true; }, 
      () => { keys.right = false; }
    );

    // 発射ボタン
    setupTouchButton('btn-launch', () => {
      if (gameState === 'PLAYING') {
        launchBall();
      } else {
        handleOverlayButtonClick();
      }
    });

    // PCキーボード操作
    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = true;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = true;
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'PLAYING') {
          launchBall();
        } else {
          handleOverlayButtonClick();
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        keys.left = false;
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        keys.right = false;
      }
    });

    // 起動処理
    window.onload = () => {
      initGame();
      // 初期状態はオーバーレイ表示
      showOverlay(
        'BLOCK BREAKOUT',
        '下部のコントローラーまたはキーボードで操作！<br>「発射」ボタンでゲーム開始',
        'ゲームスタート 🚀'
      );
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
