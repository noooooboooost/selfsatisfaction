<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ネオン・ブロック崩し (Breakout)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: manipulation; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen max-h-screen overflow-hidden flex flex-col justify-between items-center p-2 select-none">

    <!-- ヘッダー -->
    <header class="w-full max-w-sm flex items-center justify-between px-2 py-1 shrink-0">
        <h1 class="text-base font-extrabold text-cyan-400 tracking-wider flex items-center gap-1">
            ⚡ <span class="bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">BREAKOUT NEON</span>
        </h1>
        <div class="flex gap-2 text-xs font-bold bg-slate-900/90 px-3 py-1 rounded-full border border-slate-800">
            <div>SCORE: <span id="score" class="text-amber-400">0</span></div>
            <div>LIVES: <span id="lives" class="text-rose-400">❤️❤️❤️</span></div>
        </div>
    </header>

    <!-- メインゲームエリア -->
    <main class="relative w-full max-w-sm flex-1 flex items-center justify-center my-auto min-h-0">
        <canvas id="gameCanvas" width="380" height="420" class="w-full max-h-full object-contain bg-slate-900/90 rounded-xl border border-slate-800 shadow-lg shadow-cyan-950/25"></canvas>

        <!-- ゲームオーバー / クリア モーダル -->
        <div id="modal" class="hidden absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center rounded-xl p-4 text-center z-10 backdrop-blur-sm">
            <h2 id="modal-title" class="text-2xl font-black text-rose-500 mb-1">GAME OVER</h2>
            <p id="modal-desc" class="text-xs text-slate-400 mb-4">スコア: <span id="final-score" class="text-amber-400 font-bold">0</span></p>
            <button onclick="initGame()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-bold px-6 py-2.5 rounded-full text-sm shadow-lg shadow-indigo-600/30">
                もう一度遊ぶ
            </button>
        </div>
    </main>

    <!-- 固定コントローラーエリア -->
    <footer class="w-full max-w-sm shrink-0 pb-2">
        <div class="grid grid-cols-3 gap-2 px-1">
            <button id="btn-left" class="bg-slate-800 active:bg-cyan-600/50 text-cyan-400 border border-slate-700 py-3.5 rounded-xl font-black text-base flex items-center justify-center shadow-md active:scale-95 transition">
                ◀ LEFT
            </button>
            <button id="btn-action" class="bg-amber-600 active:bg-amber-500 text-white border border-amber-500 py-3.5 rounded-xl font-bold text-xs flex items-center justify-center shadow-md active:scale-95 transition">
                🚀 LAUNCH
            </button>
            <button id="btn-right" class="bg-slate-800 active:bg-cyan-600/50 text-cyan-400 border border-slate-700 py-3.5 rounded-xl font-black text-base flex items-center justify-center shadow-md active:scale-95 transition">
                RIGHT ▶
            </button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 380;
        const CANVAS_HEIGHT = 420;

        let score = 0;
        let lives = 3;
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', 'CLEAR'

        const paddle = {
            width: 75,
            height: 10,
            x: (CANVAS_WIDTH - 75) / 2,
            y: CANVAS_HEIGHT - 25,
            speed: 7,
            laserPower: false,
            laserTimer: 0
        };

        let balls = [];

        function createBall(x, y, isStuck = false) {
            return {
                x: x || paddle.x + paddle.width / 2,
                y: y || paddle.y - 8,
                radius: 6,
                dx: isStuck ? 0 : (Math.random() < 0.5 ? 2.5 : -2.5),
                dy: isStuck ? 0 : -4,
                isStuck: isStuck
            };
        }

        let lasers = [];
        let particles = [];
        let items = [];

        const brickRowCount = 5;
        const brickColumnCount = 7;
        const brickPadding = 5;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 10;
        const brickWidth = (CANVAS_WIDTH - (brickOffsetLeft * 2) - (brickPadding * (brickColumnCount - 1))) / brickColumnCount;
        const brickHeight = 14;

        const brickColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];
        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    let itemType = null;
                    if (Math.random() < 0.25) {
                        const types = ['WIDE', 'MULTI', 'LASER', 'SLOW'];
                        itemType = types[Math.floor(Math.random() * types.length)];
                    }
                    bricks[c][r] = {
                        x: 0, y: 0,
                        status: 1,
                        color: brickColors[r % brickColors.length],
                        hp: r === 0 ? 2 : 1,
                        item: itemType
                    };
                }
            }
        }

        let leftPressed = false;
        let rightPressed = false;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
            if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
            if (e.key === ' ') handleAction();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
            if (e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
        });

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnAction = document.getElementById('btn-action');

        const bindBtn = (btn, onPress, onRelease) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            btn.addEventListener('mousedown', onPress);
            btn.addEventListener('mouseup', onRelease);
            btn.addEventListener('mouseleave', onRelease);
        };

        bindBtn(btnLeft, () => leftPressed = true, () => leftPressed = false);
        bindBtn(btnRight, () => rightPressed = true, () => rightPressed = false);
        btnAction.addEventListener('click', handleAction);

        function handleAction() {
            if (gameState === 'START') {
                gameState = 'PLAYING';
                balls.forEach(b => {
                    if (b.isStuck) {
                        b.isStuck = false;
                        b.dx = (Math.random() < 0.5 ? 2.5 : -2.5);
                        b.dy = -4;
                    }
                });
            } else if (gameState === 'PLAYING' && paddle.laserPower) {
                lasers.push({ x: paddle.x + 8, y: paddle.y, dy: -8 });
                lasers.push({ x: paddle.x + paddle.width - 8, y: paddle.y, dy: -8 });
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 4,
                    dy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 2.5 + 1,
                    color: color,
                    life: 20
                });
            }
        }

        function initGame() {
            score = 0;
            lives = 3;
            gameState = 'START';
            paddle.width = 75;
            paddle.x = (CANVAS_WIDTH - paddle.width) / 2;
            paddle.laserPower = false;
            balls = [createBall(null, null, true)];
            lasers = [];
            particles = [];
            items = [];
            initBricks();
            updateUI();
            document.getElementById('modal').classList.add('hidden');
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = '❤️'.repeat(Math.max(0, lives));
            document.getElementById('btn-action').innerText = paddle.laserPower ? '🔫 SHOOT' : '🚀 LAUNCH';
        }

        function update() {
            if (gameState === 'GAMEOVER' || gameState === 'CLEAR') return;

            if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            } else if (rightPressed && paddle.x + paddle.width < CANVAS_WIDTH) {
                paddle.x += paddle.speed;
            }

            balls.forEach(b => {
                if (b.isStuck) {
                    b.x = paddle.x + paddle.width / 2;
                    b.y = paddle.y - b.radius;
                }
            });

            if (gameState === 'PLAYING') {
                for (let i = balls.length - 1; i >= 0; i--) {
                    const b = balls[i];
                    if (b.isStuck) continue;

                    b.x += b.dx;
                    b.y += b.dy;

                    if (b.x + b.radius > CANVAS_WIDTH || b.x - b.radius < 0) b.dx = -b.dx;
                    if (b.y - b.radius < 0) b.dy = -b.dy;

                    if (
                        b.y + b.radius >= paddle.y &&
                        b.y - b.radius <= paddle.y + paddle.height &&
                        b.x >= paddle.x &&
                        b.x <= paddle.x + paddle.width &&
                        b.dy > 0
                    ) {
                        const hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        const angle = hitPoint * (Math.PI / 3);
                        const currentSpeed = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
                        b.dx = currentSpeed * Math.sin(angle);
                        b.dy = -currentSpeed * Math.cos(angle);
                    }

                    for (let c = 0; c < brickColumnCount; c++) {
                        for (let r = 0; r < brickRowCount; r++) {
                            const brick = bricks[c][r];
                            if (brick.status === 1) {
                                if (b.x > brick.x && b.x < brick.x + brickWidth && b.y > brick.y && b.y < brick.y + brickHeight) {
                                    b.dy = -b.dy;
                                    brick.hp--;
                                    if (brick.hp <= 0) {
                                        brick.status = 0;
                                        score += 10;
                                        createParticles(brick.x + brickWidth / 2, brick.y + brickHeight / 2, brick.color);
                                        if (brick.item) {
                                            items.push({ x: brick.x + brickWidth / 2, y: brick.y + brickHeight / 2, type: brick.item, dy: 2 });
                                        }
                                    }
                                    updateUI();
                                }
                            }
                        }
                    }

                    if (b.y - b.radius > CANVAS_HEIGHT) {
                        balls.splice(i, 1);
                    }
                }

                if (balls.length === 0) {
                    lives--;
                    updateUI();
                    if (lives <= 0) {
                        showGameOver(false);
                    } else {
                        balls.push(createBall(null, null, true));
                        gameState = 'START';
                    }
                }

                for (let i = lasers.length - 1; i >= 0; i--) {
                    const l = lasers[i];
                    l.y += l.dy;
                    for (let c = 0; c < brickColumnCount; c++) {
                        for (let r = 0; r < brickRowCount; r++) {
                            const brick = bricks[c][r];
                            if (brick.status === 1) {
                                if (l.x > brick.x && l.x < brick.x + brickWidth && l.y > brick.y && l.y < brick.y + brickHeight) {
                                    brick.hp--;
                                    if (brick.hp <= 0) {
                                        brick.status = 0;
                                        score += 10;
                                        createParticles(brick.x + brickWidth / 2, brick.y + brickHeight / 2, brick.color);
                                    }
                                    lasers.splice(i, 1);
                                    updateUI();
                                    break;
                                }
                            }
                        }
                    }
                    if (l.y < 0) lasers.splice(i, 1);
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    item.y += item.dy;
                    if (item.y >= paddle.y && item.y <= paddle.y + paddle.height && item.x >= paddle.x && item.x <= paddle.x + paddle.width) {
                        applyPowerUp(item.type);
                        items.splice(i, 1);
                    } else if (item.y > CANVAS_HEIGHT) {
                        items.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.dx; p.y += p.dy; p.life--;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                if (paddle.laserPower) {
                    paddle.laserTimer--;
                    if (paddle.laserTimer <= 0) { paddle.laserPower = false; updateUI(); }
                }

                let remainingBricks = 0;
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        if (bricks[c][r].status === 1) remainingBricks++;
                    }
                }
                if (remainingBricks === 0) showGameOver(true);
            }
        }

        function applyPowerUp(type) {
            score += 20;
            if (type === 'WIDE') paddle.width = Math.min(120, paddle.width + 25);
            else if (type === 'MULTI') {
                const b = balls[0] || { x: paddle.x + paddle.width / 2, y: paddle.y - 10 };
                balls.push(createBall(b.x, b.y), createBall(b.x, b.y));
            } else if (type === 'LASER') {
                paddle.laserPower = true;
                paddle.laserTimer = 400;
                updateUI();
            } else if (type === 'SLOW') {
                balls.forEach(b => { b.dx *= 0.7; b.dy *= 0.7; });
            }
        }

        function showGameOver(isWin) {
            gameState = isWin ? 'CLEAR' : 'GAMEOVER';
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const finalScore = document.getElementById('final-score');
            title.innerText = isWin ? 'STAGE CLEAR! 🎉' : 'GAME OVER 💀';
            title.className = isWin ? 'text-2xl font-black text-emerald-400 mb-1' : 'text-2xl font-black text-rose-500 mb-1';
            finalScore.innerText = score;
            modal.classList.remove('hidden');
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const brick = bricks[c][r];
                    if (brick.status === 1) {
                        const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        brick.x = brickX; brick.y = brickY;

                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 3);
                        ctx.fillStyle = brick.hp > 1 ? '#cbd5e1' : brick.color;
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }

            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 5);
            ctx.fillStyle = paddle.laserPower ? '#f59e0b' : '#38bdf8';
            ctx.shadowColor = paddle.laserPower ? '#f59e0b' : '#38bdf8';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();

            balls.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f43f5e';
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.closePath();
            });

            ctx.fillStyle = '#fbbf24';
            lasers.forEach(l => ctx.fillRect(l.x - 1.5, l.y, 3, 10));

            items.forEach(item => {
                ctx.beginPath();
                ctx.arc(item.x, item.y, 7, 0, Math.PI * 2);
                ctx.fillStyle = item.type === 'WIDE' ? '#3b82f6' : item.type === 'MULTI' ? '#ec4899' : item.type === 'LASER' ? '#f59e0b' : '#10b981';
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 8px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.type === 'WIDE' ? 'W' : item.type === 'MULTI' ? 'M' : item.type === 'LASER' ? 'L' : 'S', item.x, item.y);
                ctx.closePath();
            });

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.closePath();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initGame();
        loop();
    </script>
</body>
</html>
