<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ネオン・ブロック崩し Compact</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        canvas {
            touch-action: none;
        }
        .neon-border {
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }
        .neon-text {
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.8), 0 0 15px rgba(147, 51, 234, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen max-h-screen w-screen flex flex-col justify-between items-center p-2 select-none overflow-hidden">

    <!-- 1. 上部コンパクトヘッダー -->
    <div class="w-full max-w-sm flex flex-col items-center gap-1 shrink-0">
        <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-amber-400 neon-text leading-tight">
            ⚡ BREAKOUT NEON
        </h1>

        <!-- スコア・ライフ表示 -->
        <div class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 flex justify-between items-center text-xs font-bold shadow">
            <div class="flex items-center gap-1">
                <span class="text-slate-400">SCORE:</span>
                <span id="score" class="text-cyan-400 font-mono text-sm">0</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="text-slate-400">HIGH:</span>
                <span id="highscore" class="text-amber-400 font-mono text-sm">0</span>
            </div>
            <div class="flex items-center gap-1">
                <span class="text-slate-400">LIVES:</span>
                <div id="lives-container" class="flex gap-0.5 text-red-500 text-xs">
                    ❤️❤️❤️
                </div>
            </div>
        </div>
    </div>

    <!-- 2. ゲームキャンバス & モーダル（中央可変フィット） -->
    <div class="relative w-full max-w-sm flex-1 flex items-center justify-center min-h-0 my-1">
        <canvas id="gameCanvas" width="400" height="460" class="bg-slate-900/90 rounded-xl border border-slate-800 shadow-xl max-w-full max-h-full object-contain neon-border"></canvas>

        <!-- スタート / ポーズ / リザルト用モーダル -->
        <div id="modal" class="absolute inset-0 bg-black/85 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center p-4 text-center space-y-3 z-10">
            <h2 id="modal-title" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">
                BREAKOUT NEON
            </h2>
            <p id="modal-desc" class="text-xs text-slate-300 leading-relaxed max-w-xs">
                ボールを打ち返してブロックを破壊しよう！<br>
                アイテム（🏓拡大 🔴マルチ 🔫レーザー 🐢減速）を獲得！
            </p>
            <button id="start-btn" onclick="startGame()" class="w-full max-w-xs bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-95 text-white font-black py-2.5 px-5 rounded-lg shadow transition-all text-xs tracking-wider">
                ▶ ゲームスタート
            </button>
        </div>
    </div>

    <!-- 3. スマホ用コンパクトコントローラー（下部固定） -->
    <div class="w-full max-w-sm shrink-0 mb-1">
        <div class="grid grid-cols-3 gap-1.5">
            <button id="btn-left" class="bg-slate-800 active:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-2 rounded-lg text-sm shadow active:scale-95 transition-all flex items-center justify-center">
                ◀ LEFT
            </button>
            <button id="btn-action" class="bg-indigo-600 active:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs shadow active:scale-95 transition-all flex flex-col items-center justify-center">
                <span class="text-xs">🚀 LAUNCH</span>
            </button>
            <button id="btn-right" class="bg-slate-800 active:bg-slate-700 border border-slate-700 text-slate-200 font-bold py-2 rounded-lg text-sm shadow active:scale-95 transition-all flex items-center justify-center">
                RIGHT ▶
            </button>
        </div>
    </div>

    <!-- ゲームロジックScript -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 定数設定（コンパクトキャンバス用 400x460）
        const CANVAS_WIDTH = 400;
        const CANVAS_HEIGHT = 460;
        const BRICK_ROWS = 5;
        const BRICK_COLS = 7;
        const BRICK_PADDING = 5;
        const BRICK_OFFSET_TOP = 40;
        const BRICK_OFFSET_LEFT = 10;
        const BRICK_WIDTH = (CANVAS_WIDTH - (BRICK_OFFSET_LEFT * 2) - (BRICK_PADDING * (BRICK_COLS - 1))) / BRICK_COLS;
        const BRICK_HEIGHT = 15;

        // ブロック種類
        const BRICK_TYPES = [
            { color: '#ef4444', points: 50, hp: 2 }, // 赤: 耐久2
            { color: '#f97316', points: 30, hp: 1 }, // オレンジ
            { color: '#eab308', points: 20, hp: 1 }, // 黄
            { color: '#22c55e', points: 15, hp: 1 }, // 緑
            { color: '#06b6d4', points: 10, hp: 1 }  // シアン
        ];

        // アイテム定義
        const POWERUP_TYPES = [
            { type: 'WIDE', color: '#3b82f6', icon: '🏓' },
            { type: 'MULTI', color: '#ec4899', icon: '🔴' },
            { type: 'LASER', color: '#eab308', icon: '🔫' },
            { type: 'SLOW', color: '#10b981', icon: '🐢' }
        ];

        // ゲーム状態
        let score = 0;
        let lives = 3;
        let highscore = localStorage.getItem('breakout_compact_highscore') || 0;
        let isGameRunning = false;
        let isBallAttached = true;
        let animationId = null;

        // パドル
        const paddle = {
            width: 70,
            height: 10,
            x: (CANVAS_WIDTH - 70) / 2,
            y: CANVAS_HEIGHT - 30,
            speed: 7.5,
            hasLaser: false,
            laserTimer: 0,
            wideTimer: 0
        };

        let balls = [];
        let bricks = [];
        let powerups = [];
        let lasers = [];
        let particles = [];

        document.getElementById('highscore').innerText = highscore;

        function initBricks() {
            bricks = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[r] = [];
                const type = BRICK_TYPES[r];
                for (let c = 0; c < BRICK_COLS; c++) {
                    bricks[r][c] = {
                        x: BRICK_OFFSET_LEFT + c * (BRICK_WIDTH + BRICK_PADDING),
                        y: BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
                        hp: type.hp,
                        maxHp: type.hp,
                        color: type.color,
                        points: type.points,
                        status: 1
                    };
                }
            }
        }

        function createBall(x, y, vx, vy) {
            return {
                x: x,
                y: y,
                radius: 5,
                speed: 5.2,
                vx: vx || 0,
                vy: vy || -5.2
            };
        }

        function resetGame() {
            score = 0;
            lives = 3;
            updateUI();
            initBricks();
            resetPaddleAndBall();
            powerups = [];
            lasers = [];
            particles = [];
        }

        function resetPaddleAndBall() {
            paddle.width = 70;
            paddle.x = (CANVAS_WIDTH - paddle.width) / 2;
            paddle.hasLaser = false;
            paddle.laserTimer = 0;
            paddle.wideTimer = 0;

            isBallAttached = true;
            balls = [createBall(paddle.x + paddle.width / 2, paddle.y - 6, 0, -5.2)];
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            const hearts = '❤️'.repeat(Math.max(0, lives));
            document.getElementById('lives-container').innerText = hearts || '💀';
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 2.5 + 1,
                    color: color,
                    alpha: 1,
                    life: 0.05
                });
            }
        }

        function spawnPowerup(x, y) {
            if (Math.random() < 0.28) {
                const pType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
                powerups.push({
                    x: x,
                    y: y,
                    vy: 1.8,
                    type: pType.type,
                    color: pType.color,
                    icon: pType.icon
                });
            }
        }

        function launchBall() {
            if (isBallAttached && balls.length > 0) {
                isBallAttached = false;
                const angle = (Math.random() * 0.4 - 0.2);
                balls[0].vx = balls[0].speed * Math.sin(angle);
                balls[0].vy = -balls[0].speed * Math.cos(angle);
            } else if (paddle.hasLaser) {
                lasers.push({ x: paddle.x + 8, y: paddle.y, vy: -9 });
                lasers.push({ x: paddle.x + paddle.width - 8, y: paddle.y, vy: -9 });
            }
        }

        const keys = { left: false, right: false };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') launchBall();
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnAction = document.getElementById('btn-action');

        const bindTouch = (elem, onStart, onEnd) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
            elem.addEventListener('mousedown', (e) => { e.preventDefault(); onStart(); });
            elem.addEventListener('mouseup', (e) => { e.preventDefault(); onEnd(); });
        };

        bindTouch(btnLeft, () => keys.left = true, () => keys.left = false);
        bindTouch(btnRight, () => keys.right = true, () => keys.right = false);
        btnAction.addEventListener('click', launchBall);

        function update() {
            if (keys.left && paddle.x > 0) paddle.x -= paddle.speed;
            if (keys.right && paddle.x + paddle.width < CANVAS_WIDTH) paddle.x += paddle.speed;

            if (isBallAttached && balls.length > 0) {
                balls[0].x = paddle.x + paddle.width / 2;
                balls[0].y = paddle.y - 6;
            }

            if (paddle.wideTimer > 0) {
                paddle.wideTimer--;
                if (paddle.wideTimer === 0) paddle.width = 70;
            }
            if (paddle.laserTimer > 0) {
                paddle.laserTimer--;
                if (paddle.laserTimer === 0) paddle.hasLaser = false;
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.y += l.vy;
                if (l.y < 0) { lasers.splice(i, 1); continue; }

                let hit = false;
                for (let r = 0; r < BRICK_ROWS; r++) {
                    for (let c = 0; c < BRICK_COLS; c++) {
                        const b = bricks[r][c];
                        if (b.status > 0 && l.x > b.x && l.x < b.x + BRICK_WIDTH && l.y > b.y && l.y < b.y + BRICK_HEIGHT) {
                            b.hp--;
                            createParticles(l.x, l.y, b.color);
                            if (b.hp <= 0) {
                                b.status = 0;
                                score += b.points;
                                spawnPowerup(b.x + BRICK_WIDTH / 2, b.y + BRICK_HEIGHT);
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) break;
                }
                if (hit) lasers.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;

                if (p.y + 8 >= paddle.y && p.y - 8 <= paddle.y + paddle.height &&
                    p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                    continue;
                }
                if (p.y > CANVAS_HEIGHT) powerups.splice(i, 1);
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                if (isBallAttached) continue;

                b.x += b.vx;
                b.y += b.vy;

                if (b.x - b.radius < 0) { b.x = b.radius; b.vx = -b.vx; }
                else if (b.x + b.radius > CANVAS_WIDTH) { b.x = CANVAS_WIDTH - b.radius; b.vx = -b.vx; }

                if (b.y - b.radius < 0) { b.y = b.radius; b.vy = -b.vy; }

                if (b.y + b.radius >= paddle.y && b.y - b.radius <= paddle.y + paddle.height &&
                    b.x >= paddle.x && b.x <= paddle.x + paddle.width && b.vy > 0) {
                    
                    const hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    const bounceAngle = hitPoint * (Math.PI / 3);
                    const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                    b.vx = speed * Math.sin(bounceAngle);
                    b.vy = -speed * Math.cos(bounceAngle);
                }

                for (let r = 0; r < BRICK_ROWS; r++) {
                    for (let c = 0; c < BRICK_COLS; c++) {
                        const br = bricks[r][c];
                        if (br.status > 0) {
                            if (b.x + b.radius > br.x && b.x - b.radius < br.x + BRICK_WIDTH &&
                                b.y + b.radius > br.y && b.y - b.radius < br.y + BRICK_HEIGHT) {
                                
                                b.vy = -b.vy;
                                br.hp--;
                                createParticles(b.x, b.y, br.color);
                                b.vx *= 1.015;
                                b.vy *= 1.015;

                                if (br.hp <= 0) {
                                    br.status = 0;
                                    score += br.points;
                                    spawnPowerup(br.x + BRICK_WIDTH / 2, br.y + BRICK_HEIGHT);
                                }
                                updateUI();
                                break;
                            }
                        }
                    }
                }

                if (b.y - b.radius > CANVAS_HEIGHT) balls.splice(i, 1);
            }

            if (balls.length === 0 && !isBallAttached) {
                lives--;
                updateUI();
                if (lives <= 0) gameOver();
                else resetPaddleAndBall();
            }

            let allCleared = true;
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    if (bricks[r][c].status > 0) { allCleared = false; break; }
                }
            }
            if (allCleared && isGameRunning) gameVictory();

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }
        }

        function applyPowerup(type) {
            score += 50;
            updateUI();
            if (type === 'WIDE') {
                paddle.width = 100;
                paddle.wideTimer = 500;
            } else if (type === 'MULTI') {
                const count = balls.length;
                for (let i = 0; i < count; i++) {
                    const base = balls[i] || { x: paddle.x + paddle.width / 2, y: paddle.y - 10 };
                    balls.push(createBall(base.x, base.y, 3.5, -4));
                    balls.push(createBall(base.x, base.y, -3.5, -4));
                }
            } else if (type === 'LASER') {
                paddle.hasLaser = true;
                paddle.laserTimer = 450;
            } else if (type === 'SLOW') {
                balls.forEach(b => {
                    b.vx *= 0.7;
                    b.vy *= 0.7;
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const b = bricks[r][c];
                    if (b.status > 0) {
                        ctx.fillStyle = b.color;
                        ctx.globalAlpha = b.hp < b.maxHp ? 0.5 : 1.0;
                        ctx.beginPath();
                        ctx.roundRect(b.x, b.y, BRICK_WIDTH, BRICK_HEIGHT, 3);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.fillRect(b.x, b.y, BRICK_WIDTH, 2);
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            ctx.fillStyle = paddle.hasLaser ? '#f59e0b' : '#3b82f6';
            ctx.shadowColor = paddle.hasLaser ? '#f59e0b' : '#3b82f6';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 5);
            ctx.fill();
            ctx.shadowBlur = 0;

            if (paddle.hasLaser) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(paddle.x + 6, paddle.y - 3, 3, 3);
                ctx.fillRect(paddle.x + paddle.width - 9, paddle.y - 3, 3, 3);
            }

            ctx.fillStyle = '#ef4444';
            lasers.forEach(l => ctx.fillRect(l.x - 1, l.y, 2, 7));

            balls.forEach(b => {
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            powerups.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.icon, p.x, p.y + 3);
            });

            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.alpha;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function loop() {
            if (isGameRunning) {
                update();
                draw();
                animationId = requestAnimationFrame(loop);
            }
        }

        function checkHighScore() {
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('breakout_compact_highscore', highscore);
                document.getElementById('highscore').innerText = highscore;
            }
        }

        function gameOver() {
            isGameRunning = false;
            checkHighScore();
            showModal('GAME OVER', `スコア: ${score} 点<br>ゲームオーバー！`, '🔄 リトライ');
        }

        function gameVictory() {
            isGameRunning = false;
            checkHighScore();
            showModal('CLEAR!', `全ブロック破壊完了！<br>スコア: ${score} 点`, '🎉 もう一度遊ぶ');
        }

        function showModal(title, desc, btnText) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerHTML = desc;
            document.getElementById('start-btn').innerText = btnText;
            document.getElementById('modal').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('modal').classList.add('hidden');
            resetGame();
            isGameRunning = true;
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        initBricks();
        resetPaddleAndBall();
        draw();
    </script>
</body>
</html>
