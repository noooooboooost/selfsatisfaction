<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小学生ラグビー・5mペナルティタックルタイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 500px;
      height: 100vh;
      max-height: 800px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      background: rgba(0,0,0,0.75);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    
    .action-zone {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tap-btn {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff4d4d 0%, #cc0000 70%, #800000 100%);
      border: 5px solid #ffffff;
      box-shadow: 0 0 25px rgba(255, 77, 77, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: pulse 1.2s infinite;
      touch-action: manipulation;
    }
    .tap-btn:active {
      transform: scale(0.92);
    }
    .tap-inner-circle {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: #fff;
    }
    .btn-label {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      margin-top: 6px;
      background: rgba(0,0,0,0.7);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .physical-badge {
      font-size: 13px;
      font-weight: bold;
      color: #00ffcc;
      background: rgba(0,0,0,0.85);
      border: 2px solid #00ffcc;
      padding: 10px 18px;
      border-radius: 20px;
      text-align: center;
      animation: pulse-physical 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(255, 77, 77, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
    }
    @keyframes pulse-physical {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(0, 255, 204, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
    }

    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      z-index: 10;
    }
    .modal-title { font-size: 22px; font-weight: bold; color: #ffd700; margin-bottom: 12px; }
    .modal-desc { font-size: 13px; color: #ddd; line-height: 1.6; margin-bottom: 16px; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;}
    
    .mode-select {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mode-btn {
      background: #333;
      border: 2px solid #555;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }
    .mode-btn.active {
      background: #ff4d4d;
      border-color: #fff;
    }

    .start-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    
    .feedback-pop {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .show-pop {
      opacity: 1;
      transform: translate(-50%, -55%) scale(1.1);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <div class="ui-layer">
    <div class="hud-top">
      <div class="title">ミニラグビー：5mペナルティタックル練習</div>
      <div class="subtitle" id="sub-mode-desc">相手5mから突進！1.0m〜1.5mで操作！</div>
      <div class="stats">
        <div>スコア: <span id="score">0</span></div>
        <div>回数: <span id="tries">0</span>/5</div>
      </div>
    </div>

    <!-- タップモード用UI -->
    <div class="action-zone" id="tap-action-zone">
      <div class="tap-btn" id="tackle-btn">
        <div class="tap-inner-circle">腰落</div>
      </div>
      <div class="btn-label">ここをタップ！</div>
    </div>

    <!-- フィジカルモード用UI (垂直保持・正対用) -->
    <div class="action-zone hidden" id="physical-action-zone">
      <div class="physical-badge">📱 画面を正面に向けたままで<br>グッと腰を落とせ！</div>
    </div>
  </div>

  <div id="feedback" class="feedback-pop">PERFECT!</div>

  <!-- Start Modal -->
  <div id="start-modal" class="modal">
    <div class="modal-title">ミニラグビー 5mペナルティ対策</div>
    
    <div style="font-size: 13px; color: #aaa; margin-bottom: 8px;">操作モードを選択：</div>
    <div class="mode-select">
      <button class="mode-btn active" id="btn-mode-tap" onclick="selectMode('tap')">👆 タップモード</button>
      <button class="mode-btn" id="btn-mode-physical" onclick="selectMode('physical')">🏃‍♂️ フィジカルモード</button>
    </div>

    <div class="modal-desc" id="mode-instruction">
      ・画面下の<b>【腰落】ボタン</b>を1.0m〜1.5mの距離でタップ！<br>
      ・机の上や手軽にタイミング練習をしたい時におすすめです。
    </div>

    <button class="start-btn" onclick="startGame()">練習スタート！</button>
  </div>

  <!-- Result Modal -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-title" id="res-title">結果発表</div>
    <div class="modal-desc" id="res-desc">...</div>
    <button class="start-btn" onclick="restartGame()">もう一度挑戦</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  let width, height;
  function resize() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let state = 'INIT';
  let playMode = 'tap';
  let score = 0;
  let currentTry = 0;
  const maxTries = 5;
  
  let distance = 5.0; 
  let relativeSpeed = 0.08; 
  let isTackled = false;
  let resultHistory = [];

  const btn = document.getElementById('tackle-btn');
  const feedback = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const triesEl = document.getElementById('tries');

  function selectMode(mode) {
    playMode = mode;
    document.getElementById('btn-mode-tap').classList.toggle('active', mode === 'tap');
    document.getElementById('btn-mode-physical').classList.toggle('active', mode === 'physical');
    
    const inst = document.getElementById('mode-instruction');
    if (mode === 'tap') {
      inst.innerHTML = "・画面下の<b>【腰落】ボタン</b>を1.0m〜1.5mの距離でタップ！<br>・机の上や手軽にタイミング練習をしたい時におすすめです。";
    } else {
      inst.innerHTML = "・スマホを<b>地面と垂直（自分と正対・画面を正面に向けた状態）</b>に持ちます。<br>・前を向いた正しい姿勢のまま、1.0m〜1.5mのタイミングで<b>実際に身体ごとグッと腰を落としてください！</b><br><small style='color:#ffcc00;'>※スマホの落下や周囲の安全に十分ご注意ください。</small>";
    }
  }

  async function requestMotionPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission !== 'granted') {
          alert('モーションセンサーの許可が必要です。タップモードをご利用ください。');
          selectMode('tap');
        }
      } catch (e) {
        console.error(e);
      }
    }
  }

  // --- 垂直正対ポジション用：重力加速度の上下動（Z軸＋Y軸の傾き変化）を検知 ---
  let lastVerticalValue = 0;
  window.addEventListener('devicemotion', (event) => {
    if (playMode !== 'physical' || state !== 'RUNNING' || isTackled) return;

    const accel = event.accelerationIncludingGravity;
    if (!accel) return;

    // スマホを垂直（正面）に持った時、上下の沈み込みは重力成分（通常Y軸やZ軸に分散）の急激な変化として現れます。
    // 正面を向いて真っ直ぐ沈み込んだときの変動（ay と az の組み合わせ）をキャッチします。
    const ay = accel.y || 0;
    const az = accel.z || 0;
    
    // 垂直保持状態での沈み込みによる縦方向の重力ベクトル変化
    const verticalMetric = ay + az;
    const delta = verticalMetric - lastVerticalValue;
    lastVerticalValue = verticalMetric;

    // 実際にグッと腰を落とした瞬間の急激な上下動のしきい値
    if (Math.abs(delta) > 9.5) {
      triggerTackle();
    }
  });

  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (playMode === 'tap') triggerTackle();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      triggerTackle();
    }
  });

  async function startGame() {
    if (playMode === 'physical') {
      await requestMotionPermission();
    }

    document.getElementById('start-modal').classList.add('hidden');
    
    document.getElementById('tap-action-zone').classList.toggle('hidden', playMode !== 'tap');
    document.getElementById('physical-action-zone').classList.toggle('hidden', playMode !== 'physical');
    document.getElementById('sub-mode-desc').innerText = playMode === 'tap' 
      ? "相手5mから突進！1.0m〜1.5mでタップ！" 
      : "相手5mから突進！画面を正面に向けたまま腰を落とせ！";

    score = 0;
    currentTry = 0;
    resultHistory = [];
    scoreEl.innerText = score;
    triesEl.innerText = currentTry;
    nextTry();
  }

  function restartGame() {
    document.getElementById('result-modal').classList.add('hidden');
    document.getElementById('start-modal').classList.remove('hidden');
  }

  function nextTry() {
    if (currentTry >= maxTries) {
      endGame();
      return;
    }
    currentTry++;
    triesEl.innerText = currentTry;
    
    distance = 5.0;
    relativeSpeed = 0.07 + Math.random() * 0.035; 
    isTackled = false;
    state = 'RUNNING';
  }

  function triggerTackle() {
    if (state !== 'RUNNING' || isTackled) return;
    isTackled = true;
    evaluateTackle(distance);
  }

  function evaluateTackle(dist) {
    let evalText = "";
    let color = "";
    let pts = 0;

    if (dist >= 1.0 && dist <= 1.5) {
      evalText = "PERFECT!! (最高の低さ・完璧なヒット)";
      color = "#00ffcc";
      pts = 100;
    } else if (dist > 1.5 && dist <= 2.0) {
      evalText = "TOO EARLY! (早すぎて足が止まった)";
      color = "#ffcc00";
      pts = 50;
    } else if (dist > 2.0) {
      evalText = "WAY TOO EARLY! (相手がまだ遠い)";
      color = "#ff9900";
      pts = 20;
    } else if (dist < 1.0 && dist >= 0.5) {
      evalText = "TOO LATE! (体勢が高くて押し込まれた)";
      color = "#ff6666";
      pts = 40;
    } else {
      evalText = "CRASH! (遅すぎて吹き飛ばされた)";
      color = "#ff0000";
      pts = 0;
    }

    score += pts;
    scoreEl.innerText = score;
    resultHistory.push({ dist: dist.toFixed(2), evalText, pts });

    showFeedback(evalText, color);
    state = 'RESULT_PAUSE';
    setTimeout(() => {
      nextTry();
    }, 1500);
  }

  function showFeedback(text, color) {
    feedback.innerText = text;
    feedback.style.color = color;
    feedback.classList.add('show-pop');
    setTimeout(() => {
      feedback.classList.remove('show-pop');
    }, 1200);
  }

  function endGame() {
    state = 'END';
    const resModal = document.getElementById('result-modal');
    const title = document.getElementById('res-title');
    const desc = document.getElementById('res-desc');
    
    title.innerText = `最終スコア: ${score}点`;
    
    let summaryHtml = "<div style='text-align:left; font-size:13px; line-height:1.8;'>";
    resultHistory.forEach((r, idx) => {
      summaryHtml += `<b>${idx+1}本目:</b> 距離 <b>${r.dist}m</b> - ${r.evalText}<br>`;
    });
    summaryHtml += "</div><br>";

    if (score >= 400) {
      summaryHtml += "<b style='color:#00ffcc;'>素晴らしい！正しい姿勢のまま完璧なタイミングで入れてます！</b>";
    } else {
      summaryHtml += "前を向いた正しい姿勢をキープし、1.0m〜1.5mのタイミングで沈み込む練習を続けましょう！";
    }

    desc.innerHTML = summaryHtml;
    resModal.classList.remove('hidden');
  }

  let lastTime = performance.now();
  function update(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (state === 'RUNNING') {
      distance -= relativeSpeed * (dt * 60);
      if (distance <= 0) {
        distance = 0;
        triggerTackle();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    const horizon = height * 0.38;
    
    const skyGradient = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGradient.addColorStop(0, '#0f172a');
    skyGradient.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, horizon);

    const grassGradient = ctx.createLinearGradient(0, horizon, 0, height);
    grassGradient.addColorStop(0, '#166534');
    grassGradient.addColorStop(1, '#052e16');
    ctx.fillStyle = grassGradient;
    ctx.fillRect(0, horizon, width, height - horizon);

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    const vpX = width / 2;
    const vpY = horizon;

    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(vpX, vpY);
      ctx.lineTo(vpX + i * (width * 0.4), height);
      ctx.stroke();
    }

    const drawDistanceLine = (distMeter, label, lineColor) => {
      const scale = Math.pow(0.65, distMeter);
      const lineY = horizon + (height - horizon) * scale;
      const lineWidthAtY = width * scale;

      ctx.strokeStyle = lineColor;
      ctx.lineWidth = (distMeter === 1.5 || distMeter === 1.0) ? 4 : 2;
      ctx.beginPath();
      ctx.moveTo(vpX - lineWidthAtY, lineY);
      ctx.lineTo(vpX + lineWidthAtY, lineY);
      ctx.stroke();

      ctx.fillStyle = lineColor;
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, vpX + lineWidthAtY + 8, lineY + 4);
    };

    const y15 = horizon + (height - horizon) * Math.pow(0.65, 1.5);
    const y10 = horizon + (height - horizon) * Math.pow(0.65, 1.0);
    const w15 = width * Math.pow(0.65, 1.5);
    const w10 = width * Math.pow(0.65, 1.0);

    ctx.fillStyle = 'rgba(0, 255, 204, 0.25)';
    ctx.beginPath();
    ctx.moveTo(vpX - w15, y15);
    ctx.lineTo(vpX + w15, y15);
    ctx.lineTo(vpX + w10, y10);
    ctx.lineTo(vpX - w10, y10);
    ctx.closePath();
    ctx.fill();

    drawDistanceLine(5.0, "5.0m [ペナルティ位置]", "rgba(255,255,255,0.5)");
    drawDistanceLine(3.0, "3.0m", "rgba(255,255,255,0.3)");
    drawDistanceLine(1.5, "1.5m [理想上限]", "#00ffcc");
    drawDistanceLine(1.0, "1.0m [理想下限]", "#00ffcc");
    drawDistanceLine(0.5, "0.5m", "rgba(255,0,0,0.6)");

    if (state === 'RUNNING' || state === 'RESULT_PAUSE') {
      const scale = Math.pow(0.65, distance);
      const runnerY = horizon + (height - horizon) * scale;
      const runnerSize = 160 * scale;

      ctx.save();
      ctx.translate(vpX, runnerY);

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 0, runnerSize * 0.5, runnerSize * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.fillRect(-runnerSize * 0.2, -runnerSize * 0.4, runnerSize * 0.12, runnerSize * 0.4);
      ctx.fillRect(runnerSize * 0.08, -runnerSize * 0.4, runnerSize * 0.12, runnerSize * 0.4);

      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.roundRect(-runnerSize * 0.3, -runnerSize * 0.9, runnerSize * 0.6, runnerSize * 0.55, 8);
      ctx.fill();

      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(0, -runnerSize * 1.05, runnerSize * 0.18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.ellipse(-runnerSize * 0.15, -runnerSize * 0.7, runnerSize * 0.15, runnerSize * 0.1, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`相手との距離: ${distance.toFixed(2)} m`, vpX, height - 165);
    }
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>

</body>
</html>
