<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小学生ラグビー・5mペナルティタックル訓練</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 500px;
      height: 100vh;
      max-height: 800px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      background: rgba(0,0,0,0.8);
      padding: 10px 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
      margin-bottom: 2px;
    }
    .subtitle {
      font-size: 11px;
      color: #00ffcc;
      text-align: center;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 6px;
      font-size: 13px;
      font-weight: bold;
    }
    
    .action-zone-straight {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      width: 90%;
      max-width: 380px;
    }
    .tackle-btn-big {
      width: 100%;
      background: radial-gradient(circle, #ff4d4d 0%, #cc0000 70%, #800000 100%);
      border: 4px solid #ffffff;
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 20px rgba(255, 77, 77, 0.8);
      cursor: pointer;
    }
    .tackle-btn-big:active { transform: scale(0.97); }

    .action-zone-lateral {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      width: 95%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .lat-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 3px solid #fff;
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
      cursor: pointer;
    }
    .lat-btn:active { transform: scale(0.95); background: linear-gradient(135deg, #1d4ed8, #1e40af); }
    .lat-btn.left { background: linear-gradient(135deg, #059669, #047857); }
    .lat-btn.right { background: linear-gradient(135deg, #dc2626, #b91c1c); }

    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      z-index: 10;
    }
    .modal-title { font-size: 20px; font-weight: bold; color: #ffd700; margin-bottom: 10px; }
    .modal-desc { font-size: 12px; color: #ddd; line-height: 1.5; margin-bottom: 16px; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;}
    
    .mode-select {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      width: 100%;
    }
    .mode-select-btn {
      flex: 1;
      background: #333;
      border: 2px solid #555;
      color: #fff;
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }
    .mode-select-btn.active {
      background: #2563eb;
      border-color: #ffd700;
    }

    /* スピード選択ボタンのデザイン */
    .speed-section {
      width: 100%;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .speed-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .speed-select {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .speed-btn {
      flex: 1;
      background: #222;
      border: 2px solid #444;
      color: #ccc;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .speed-btn.active {
      background: #059669;
      border-color: #00ffcc;
      color: #fff;
    }

    .start-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(40,167,69,0.4);
    }
    
    .feedback-pop {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .show-pop {
      opacity: 1;
      transform: translate(-50%, -55%) scale(1.1);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <div class="ui-layer">
    <div class="hud-top">
      <div class="title" id="hud-title">ミニラグビー：5mペナルティ訓練</div>
      <div class="subtitle" id="hud-subtitle">モード選択画面</div>
      <div class="stats">
        <div>スコア: <span id="score">0</span></div>
        <div>セット: <span id="tries">0</span>/5本</div>
      </div>
    </div>

    <!-- まっすぐモード用ボタン -->
    <div class="action-zone-straight" id="zone-straight">
      <button class="tackle-btn-big" onclick="onStraightAction()">⚡ 腰を落としてヒット！ (1.0〜1.5m)</button>
    </div>

    <!-- 横移動モード用3ボタン -->
    <div class="action-zone-lateral hidden" id="zone-lateral">
      <button class="lat-btn left" onclick="onLateralAction(-1)">◀ 左へ対応</button>
      <button class="lat-btn" onclick="onLateralAction(0)">▲ 正面で止める</button>
      <button class="lat-btn right" onclick="onLateralAction(1)">▶ 右へ対応</button>
    </div>
  </div>

  <div id="feedback" class="feedback-pop">PERFECT!</div>

  <!-- Start Modal -->
  <div id="start-modal" class="modal">
    <div class="modal-title">🏉 ラグビー タックル判断訓練</div>
    
    <div class="mode-select">
      <button class="mode-select-btn active" id="btn-mode-straight" onclick="setGameMode('straight')">まっすぐモード<br><span style="font-size:10px;color:#aaa;">タイミング重視</span></button>
      <button class="mode-select-btn" id="btn-mode-lateral" onclick="setGameMode('lateral')">横移動モード<br><span style="font-size:10px;color:#aaa;">へその向きを見極めろ</span></button>
    </div>

    <!-- 横移動モード選択時のみ表示する速度選択 -->
    <div class="speed-section hidden" id="speed-section">
      <div class="speed-title">相手の速さ（ステップ対応スピード）：</div>
      <div class="speed-select">
        <button class="speed-btn active" id="btn-spd-normal" onclick="setSpeedMode('normal')">普通<br><span style="font-size:9px;">(今の半分の速さ)</span></button>
        <button class="speed-btn" id="btn-spd-fast" onclick="setSpeedMode('fast')">速い</button>
        <button class="speed-btn" id="btn-spd-max" onclick="setSpeedMode('max')">最大<br><span style="font-size:9px;">(最高難易度)</span></button>
      </div>
    </div>

    <div class="modal-desc" id="mode-desc">
      <b>【まっすぐモード】</b><br>
      ・5mから相手が突進してきます。<br>
      ・<b>1.0m〜1.5m</b>のベストな間合いでボタンを押し、低くヒットするタイミングを鍛えます。
    </div>

    <button class="start-btn" onclick="startGame()">5本1セット スタート！</button>
  </div>

  <!-- Result Modal -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-title" id="res-title">結果発表</div>
    <div class="modal-desc" id="res-desc">...</div>
    <button class="start-btn" onclick="restartGame()">もう一度挑戦</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  let width, height;
  function resize() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let gameMode = 'straight';
  let speedMode = 'normal'; // 'normal', 'fast', 'max'
  let state = 'INIT';
  let score = 0;
  let currentTry = 0;
  const maxTries = 5;
  
  let distance = 5.0; 
  let relativeSpeed = 0.07; 
  let isActionDone = false;
  let resultHistory = [];

  let moveType = 0; // -1: 左, 0: 正面, 1: 右
  let lateralOffset = 0.0;
  let hasStepped = false;

  const feedback = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const triesEl = document.getElementById('tries');

  function setGameMode(mode) {
    gameMode = mode;
    document.getElementById('btn-mode-straight').classList.toggle('active', mode === 'straight');
    document.getElementById('btn-mode-lateral').classList.toggle('active', mode === 'lateral');
    
    // スピード選択表示の切り替え
    document.getElementById('speed-section').classList.toggle('hidden', mode !== 'lateral');

    updateDescText();
  }

  function setSpeedMode(spd) {
    speedMode = spd;
    document.getElementById('btn-spd-normal').classList.toggle('active', spd === 'normal');
    document.getElementById('btn-spd-fast').classList.toggle('active', spd === 'fast');
    document.getElementById('btn-spd-max').classList.toggle('active', spd === 'max');

    updateDescText();
  }

  function updateDescText() {
    const desc = document.getElementById('mode-desc');
    if (gameMode === 'straight') {
      desc.innerHTML = "<b>【まっすぐモード】</b><br>・5mから相手が突進。<br>・<b>1.0m〜1.5m</b>のベストな間合いでボタンを押し、低くヒットするタイミングを鍛えます。";
    } else {
      let spdLabel = "普通（半分の速さ）";
      if (speedMode === 'fast') spdLabel = "速い";
      if (speedMode === 'max') spdLabel = "最大";
      desc.innerHTML = `<b>【横移動モード（設定: ${spdLabel}）】</b><br>・5mから直進後、<b>2m付近で「右・左・まっすぐ」にステップを踏みます</b>。<br>・相手の<b>へその向き（黄色いマーカー）</b>を見て、[左][正面][右]で素早く迎撃！`;
    }
  }

  function startGame() {
    document.getElementById('start-modal').classList.add('hidden');
    
    document.getElementById('zone-straight').classList.toggle('hidden', gameMode !== 'straight');
    document.getElementById('zone-lateral').classList.toggle('hidden', gameMode !== 'lateral');
    
    let spdText = "";
    if (gameMode === 'lateral') {
      if (speedMode === 'normal') spdText = " (普通)";
      if (speedMode === 'fast') spdText = " (速い)";
      if (speedMode === 'max') spdText = " (最大)";
    }

    document.getElementById('hud-title').innerText = gameMode === 'straight' ? 'まっすぐモード（タイミング）' : `横移動モード${spdText}`;
    document.getElementById('hud-subtitle').innerText = gameMode === 'straight' ? '1.0〜1.5mでヒット！' : '2m付近のへその動きを見抜け！';

    score = 0;
    currentTry = 0;
    resultHistory = [];
    scoreEl.innerText = score;
    triesEl.innerText = currentTry;
    nextTry();
  }

  function restartGame() {
    document.getElementById('result-modal').classList.add('hidden');
    document.getElementById('start-modal').classList.remove('hidden');
  }

  function nextTry() {
    if (currentTry >= maxTries) {
      endGame();
      return;
    }
    currentTry++;
    triesEl.innerText = currentTry;
    
    distance = 5.0;

    // スピードの設定計算
    if (gameMode === 'straight') {
      relativeSpeed = 0.06 + Math.random() * 0.04;
    } else {
      // 最大: 以前と同じ（0.06〜0.10）
      // 普通: 今の半分（0.03〜0.05）
      // 速い: 中間（0.045〜0.075）
      if (speedMode === 'normal') {
        relativeSpeed = 0.03 + Math.random() * 0.02;
      } else if (speedMode === 'fast') {
        relativeSpeed = 0.045 + Math.random() * 0.03;
      } else {
        relativeSpeed = 0.06 + Math.random() * 0.04;
      }
    }

    isActionDone = false;
    lateralOffset = 0.0;
    hasStepped = false;

    const rand = Math.random();
    if (rand < 0.33) moveType = -1;
    else if (rand < 0.66) moveType = 1;
    else moveType = 0;

    state = 'RUNNING';
  }

  function onStraightAction() {
    if (state !== 'RUNNING' || isActionDone) return;
    isActionDone = true;
    evaluateStraight(distance);
  }

  function onLateralAction(userChoice) {
    if (state !== 'RUNNING' || isActionDone) return;
    isActionDone = true;
    evaluateLateral(userChoice, distance);
  }

  function evaluateStraight(dist) {
    let evalText = "";
    let color = "";
    let pts = 0;

    if (dist >= 1.0 && dist <= 1.5) {
      evalText = "PERFECT!! (最高の低さ・完璧なヒット)";
      color = "#00ffcc";
      pts = 100;
    } else if (dist > 1.5 && dist <= 2.0) {
      evalText = "TOO EARLY! (早すぎて足が止まった)";
      color = "#ffcc00";
      pts = 50;
    } else if (dist > 2.0) {
      evalText = "WAY TOO EARLY! (相手がまだ遠い)";
      color = "#ff9900";
      pts = 20;
    } else if (dist < 1.0 && dist >= 0.4) {
      evalText = "TOO LATE! (体勢が高くて押し込まれた)";
      color = "#ff6666";
      pts = 40;
    } else {
      evalText = "CRASH! (遅すぎて吹き飛ばされた)";
      color = "#ff0000";
      pts = 0;
    }

    score += pts;
    scoreEl.innerText = score;
    resultHistory.push({ desc: `距離 ${dist.toFixed(2)}m`, evalText, pts });

    showFeedback(evalText, color);
    state = 'RESULT_PAUSE';
    setTimeout(() => { nextTry(); }, 1400);
  }

  function evaluateLateral(userChoice, dist) {
    let evalText = "";
    let color = "";
    let pts = 0;

    const isCorrect = (userChoice === moveType);
    const moveStr = moveType === -1 ? "左" : (moveType === 1 ? "右" : "正面");

    if (isCorrect) {
      if (dist >= 0.6 && dist <= 2.2) {
        evalText = `ナイス判断！(へそを見破った)`;
        color = "#00ffcc";
        pts = 100;
      } else {
        evalText = `方向正解！(少し遅い/早い)`;
        color = "#ffcc00";
        pts = 60;
      }
    } else {
      evalText = `逆を取られた！ (相手は[${moveStr}])`;
      color = "#ff0000";
      pts = 0;
    }

    score += pts;
    scoreEl.innerText = score;
    resultHistory.push({ desc: `相手の動き: ${moveStr}`, evalText, pts });

    showFeedback(evalText, color);
    state = 'RESULT_PAUSE';
    setTimeout(() => { nextTry(); }, 1400);
  }

  function showFeedback(text, color) {
    feedback.innerText = text;
    feedback.style.color = color;
    feedback.classList.add('show-pop');
    setTimeout(() => {
      feedback.classList.remove('show-pop');
    }, 1200);
  }

  function endGame() {
    state = 'END';
    const resModal = document.getElementById('result-modal');
    const title = document.getElementById('res-title');
    const desc = document.getElementById('res-desc');
    
    title.innerText = `5本終了！ スコア: ${score}点`;
    
    let summaryHtml = "<div style='text-align:left; font-size:12px; line-height:1.7;'>";
    resultHistory.forEach((r, idx) => {
      summaryHtml += `<b>第${idx+1}本:</b> ${r.desc} - <span style="font-weight:bold;">${r.evalText}</span> (${r.pts}pt)<br>`;
    });
    summaryHtml += "</div><br>";

    if (score >= 400) {
      summaryHtml += "<b style='color:#00ffcc;'>素晴らしい反応と判断力です！実戦でもへその向きをしっかり見据えよう！</b>";
    } else {
      summaryHtml += "相手のへその向きの変化を凝視して、切り返しに素早く対応する練習を続けよう！";
    }

    desc.innerHTML = summaryHtml;
    resModal.classList.remove('hidden');
  }

  let lastTime = performance.now();
  function update(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (state === 'RUNNING') {
      distance -= relativeSpeed * (dt * 60);

      if (gameMode === 'lateral' && distance <= 2.2 && !hasStepped) {
        hasStepped = true;
      }
      if (hasStepped && gameMode === 'lateral') {
        const targetOffset = moveType * 1.2;

        // 横移動の速さもスピード設定に応じて調整
        let stepSpeed = 0.12;
        if (speedMode === 'normal') stepSpeed = 0.06;
        if (speedMode === 'fast') stepSpeed = 0.09;

        lateralOffset += (targetOffset - lateralOffset) * stepSpeed;
      }

      if (distance <= 0) {
        distance = 0;
        if (!isActionDone) {
          isActionDone = true;
          scoreEl.innerText = score;
          showFeedback("反応遅れ！ (かわされた)", "#ff0000");
          resultHistory.push({ desc: "対応できず", evalText: "反応遅れ", pts: 0 });
          state = 'RESULT_PAUSE';
          setTimeout(() => { nextTry(); }, 1400);
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    const horizon = height * 0.38;
    
    const skyGradient = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGradient.addColorStop(0, '#0f172a');
    skyGradient.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, horizon);

    const grassGradient = ctx.createLinearGradient(0, horizon, 0, height);
    grassGradient.addColorStop(0, '#166534');
    grassGradient.addColorStop(1, '#052e16');
    ctx.fillStyle = grassGradient;
    ctx.fillRect(0, horizon, width, height - horizon);

    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    const vpX = width / 2;
    const vpY = horizon;

    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(vpX, vpY);
      ctx.lineTo(vpX + i * (width * 0.4), height);
      ctx.stroke();
    }

    const drawDistanceLine = (distMeter, label, lineColor) => {
      const scale = Math.pow(0.65, distMeter);
      const lineY = horizon + (height - horizon) * scale;
      const lineWidthAtY = width * scale;

      ctx.strokeStyle = lineColor;
      ctx.lineWidth = (distMeter === 1.5 || distMeter === 1.0) ? 4 : 2;
      ctx.beginPath();
      ctx.moveTo(vpX - lineWidthAtY, lineY);
      ctx.lineTo(vpX + lineWidthAtY, lineY);
      ctx.stroke();

      ctx.fillStyle = lineColor;
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, vpX + lineWidthAtY + 8, lineY + 4);
    };

    const y15 = horizon + (height - horizon) * Math.pow(0.65, 1.5);
    const y10 = horizon + (height - horizon) * Math.pow(0.65, 1.0);
    const w15 = width * Math.pow(0.65, 1.5);
    const w10 = width * Math.pow(0.65, 1.0);

    ctx.fillStyle = 'rgba(0, 255, 204, 0.25)';
    ctx.beginPath();
    ctx.moveTo(vpX - w15, y15);
    ctx.lineTo(vpX + w15, y15);
    ctx.lineTo(vpX + w10, y10);
    ctx.lineTo(vpX - w10, y10);
    ctx.closePath();
    ctx.fill();

    drawDistanceLine(5.0, "5.0m [ペナルティ位置]", "rgba(255,255,255,0.5)");
    drawDistanceLine(3.0, "3.0m", "rgba(255,255,255,0.3)");
    drawDistanceLine(1.5, "1.5m [理想上限]", "#00ffcc");
    drawDistanceLine(1.0, "1.0m [理想下限]", "#00ffcc");
    drawDistanceLine(0.5, "0.5m", "rgba(255,0,0,0.6)");

    if (state === 'RUNNING' || state === 'RESULT_PAUSE') {
      const scale = Math.pow(0.65, distance);
      const runnerY = horizon + (height - horizon) * scale;
      const runnerSize = 160 * scale;

      const renderX = vpX + (lateralOffset * width * 0.25 * scale);

      ctx.save();
      ctx.translate(renderX, runnerY);

      // 影
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 0, runnerSize * 0.5, runnerSize * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 足
      ctx.fillStyle = '#111';
      ctx.fillRect(-runnerSize * 0.2, -runnerSize * 0.4, runnerSize * 0.12, runnerSize * 0.4);
      ctx.fillRect(runnerSize * 0.08, -runnerSize * 0.4, runnerSize * 0.12, runnerSize * 0.4);

      // 胴体 (赤ユニフォーム)
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.roundRect(-runnerSize * 0.3, -runnerSize * 0.9, runnerSize * 0.6, runnerSize * 0.55, 8);
      ctx.fill();

      // おへそマーカー
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, -runnerSize * 0.65, runnerSize * 0.08, 0, Math.PI * 2);
      ctx.fill();

      // 頭
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(0, -runnerSize * 1.05, runnerSize * 0.18, 0, Math.PI * 2);
      ctx.fill();

      // ボール
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.ellipse(-runnerSize * 0.15, -runnerSize * 0.7, runnerSize * 0.15, runnerSize * 0.1, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 残距離
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillText(`残距離: ${distance.toFixed(2)} m`, vpX, height - 90);
      ctx.shadowBlur = 0;
    }
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>

</body>
</html>
