<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>小学生ラグビー・5mペナルティタックルタイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 500px;
      height: 100vh;
      max-height: 800px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud-top {
      background: rgba(0,0,0,0.75);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }
    
    /* 画面下部の操作案内ラベル（被らないよう最下部に配置） */
    .hud-bottom {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      border-radius: 20px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 12px;
      backdrop-filter: blur(4px);
    }

    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      z-index: 10;
    }
    .modal-title { font-size: 22px; font-weight: bold; color: #ffd700; margin-bottom: 12px; }
    .modal-desc { font-size: 13px; color: #ddd; line-height: 1.6; margin-bottom: 20px; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px;}
    
    .start-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    
    .feedback-pop {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 900;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
    }
    .show-pop {
      opacity: 1;
      transform: translate(-50%, -55%) scale(1.1);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <div class="ui-layer">
    <div class="hud-top">
      <div class="title">ミニラグビー：5mペナルティタックル練習</div>
      <div class="subtitle">相手5mから突進！1.0m〜1.5mで画面タップ！</div>
      <div class="stats">
        <div>スコア: <span id="score">0</span></div>
        <div>回数: <span id="tries">0</span>/5</div>
      </div>
    </div>

    <div class="hud-bottom">
      👆 画面のどこでもタップして腰を落とせ！
    </div>
  </div>

  <div id="feedback" class="feedback-pop">PERFECT!</div>

  <!-- Start Modal -->
  <div id="start-modal" class="modal">
    <div class="modal-title">ミニラグビー 5mペナルティ対策</div>
    <div class="modal-desc">
      ・相手は5m後ろからタップ＆突進。<br>
      ・味方FWも前に出てゲインラインを潰しにいきます。<br>
      ・間合いが<b>「1.5m〜1.0m」</b>になった瞬間に<b>画面のどこでもタップ</b>（PCはSpaceキー）して腰を落としましょう！
    </div>
    <button class="start-btn" onclick="startGame()">練習スタート！</button>
  </div>

  <!-- Result Modal -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-title" id="res-title">結果発表</div>
    <div class="modal-desc" id="res-desc">...</div>
    <button class="start-btn" onclick="restartGame()">もう一度挑戦</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');
  
  let width, height;
  function resize() {
    width = canvas.width = canvas.offsetWidth;
    height = canvas.height = canvas.offsetHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let state = 'INIT';
  let score = 0;
  let currentTry = 0;
  const maxTries = 5;
  
  let distance = 5.0; 
  let relativeSpeed = 0.08; 
  let isTackled = false;
  let resultHistory = [];

  const feedback = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const triesEl = document.getElementById('tries');

  // 画面全体どこでもタップ・クリックでアクション発動
  container.addEventListener('pointerdown', (e) => {
    // モーダル表示中は無視
    if (state === 'RUNNING') {
      e.preventDefault();
      triggerTackle();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && state === 'RUNNING') {
      e.preventDefault();
      triggerTackle();
    }
  });

  function startGame() {
    document.getElementById('start-modal').classList.add('hidden');
    score = 0;
    currentTry = 0;
    resultHistory = [];
    scoreEl.innerText = score;
    triesEl.innerText = currentTry;
    nextTry();
  }

  function restartGame() {
    document.getElementById('result-modal').classList.add('hidden');
    document.getElementById('start-modal').classList.remove('hidden');
  }

  function nextTry() {
    if (currentTry >= maxTries) {
      endGame();
      return;
    }
    currentTry++;
    triesEl.innerText = currentTry;
    
    distance = 5.0;
    relativeSpeed = 0.07 + Math.random() * 0.035; 
    isTackled = false;
    state = 'RUNNING';
  }

  function triggerTackle() {
    if (state !== 'RUNNING' || isTackled) return;
    isTackled = true;
    evaluateTackle(distance);
  }

  function evaluateTackle(dist) {
    let evalText = "";
    let color = "";
    let pts = 0;

    if (dist >= 1.0 && dist <= 1.5) {
      evalText = "PERFECT!! (最高の低さ・完璧なヒット)";
      color = "#00ffcc";
      pts = 100;
    } else if (dist > 1.5 && dist <= 2.0) {
      evalText = "TOO EARLY! (早すぎて足が止まった)";
      color = "#ffcc00";
      pts = 50;
    } else if (dist > 2.0) {
      evalText = "WAY TOO EARLY! (相手がまだ遠い)";
      color = "#ff9900";
      pts = 20;
    } else if (dist < 1.0 && dist >= 0.5) {
      evalText = "TOO LATE! (体勢が高くて押し込まれた)";
      color = "#ff6666";
      pts = 40;
    } else {
      evalText = "CRASH! (遅すぎて吹き飛ばされた)";
      color = "#ff0000";
      pts = 0;
    }

    score += pts;
    scoreEl.innerText = score;
    resultHistory.push({ dist: dist.toFixed(2), evalText, pts });

    showFeedback(evalText, color);
    state = 'RESULT_PAUSE';
    setTimeout(() => {
      nextTry();
    }, 1500);
  }

  function showFeedback(text, color) {
    feedback.innerText = text;
    feedback.style.color = color;
    feedback.classList.add('show-pop');
    setTimeout(() => {
      feedback.classList.remove('show-pop');
    }, 1200);
  }

  function endGame() {
    state = 'END';
    const resModal = document.getElementById('result-modal');
    const title = document.getElementById('res-title');
    const desc = document.getElementById('res-desc');
    
    title.innerText = `最終スコア: ${score}点`;
    
    let summaryHtml = "<div style='text-align:left; font-size:13px; line-height:1.8;'>";
    resultHistory.forEach((r, idx) => {
      summaryHtml += `<b>${idx+1}本目:</b> 距離 <b>${r.dist}m</b> - ${r.evalText}<br>`;
    });
    summaryHtml += "</div><br>";

    if (score >= 400) {
      summaryHtml += "<b style='color:#00ffcc;'>素晴らしい！5mの間合いからでも完璧なタイミングで低く入れてます！</b>";
    } else {
      summaryHtml += "1.0m〜1.5mの間合いに相手が入る瞬間に低く入れるよう繰り返し練習しましょう！";
    }

    desc.innerHTML = summaryHtml;
    resModal.classList.remove('hidden');
  }

  let lastTime = performance.now();
  function update(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (state === 'RUNNING') {
      distance -= relativeSpeed * (dt * 60);
      if (distance <= 0) {
        distance = 0;
        triggerTackle();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    const horizon = height * 0.38;
    
    // 空とグラウンド
    const skyGradient = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGradient.addColorStop(0, '#0f172a');
    skyGradient.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, width, horizon);

    const grassGradient = ctx.createLinearGradient(0, horizon, 0, height);
    grassGradient.addColorStop(0, '#166534');
    grassGradient.addColorStop(1, '#052e16');
    ctx.fillStyle = grassGradient;
    ctx.fillRect(0, horizon, width, height - horizon);

    // 遠近グリッド
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    const vpX = width / 2;
    const vpY = horizon;

    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(vpX, vpY);
      ctx.lineTo(vpX + i * (width * 0.4), height);
      ctx.stroke();
    }

    // 距離マーカー線
    const drawDistanceLine = (distMeter, label, lineColor) => {
      const scale = Math.pow(0.65, distMeter);
      const lineY = horizon + (height - horizon) * scale;
      const lineWidthAtY = width * scale;

      ctx.strokeStyle = lineColor;
      ctx.lineWidth = (distMeter === 1.5 || distMeter === 1.0) ? 4 : 2;
      ctx.beginPath();
      ctx.moveTo(vpX - lineWidthAtY, lineY);
      ctx.lineTo(vpX + lineWidthAtY, lineY);
      ctx.stroke();

      ctx.fillStyle = lineColor;
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, vpX + lineWidthAtY + 8, lineY + 4);
    };

    // 理想ゾーンハイライト
    const y15 = horizon + (height - horizon) * Math.pow(0.65, 1.5);
    const y10 = horizon + (height - horizon) * Math.pow(0.65, 1.0);
    const w15 = width * Math.pow(0.65, 1.5);
    const w10 = width * Math.pow(0.65, 1.0);

    ctx.fillStyle = 'rgba(0, 255, 204, 0.25)';
    ctx.beginPath();
    ctx.moveTo(vpX - w15, y15);
    ctx.lineTo(vpX + w15, y15);
    ctx.lineTo(vpX + w10, y10);
    ctx.lineTo(vpX - w10, y10);
    ctx.closePath();
    ctx.fill();

    drawDistanceLine(5.0, "5.0m [ペナルティ位置]", "rgba(255,255,255,0.5)");
    drawDistanceLine(3.0, "3.0m", "rgba(255,255,255,0.3)");
    drawDistanceLine(1.5, "1.5m [理想上限]", "#00ffcc");
    drawDistanceLine(1.0, "1.0m [理想下限]", "#00ffcc");
    drawDistanceLine(0.5, "0.5m", "rgba(255,0,0,0.6)");

    // 相手プレイヤーの描画
    if (state === 'RUNNING' || state === 'RESULT_PAUSE') {
      const scale = Math.pow(0.65, distance);
      const runnerY = horizon + (height - horizon) * scale;
      const runnerSize = 160 * scale;

      ctx.save();
      ctx.translate(vpX, runnerY);

      // 影
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 0, runnerSize * 0.5, runnerSize * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 足
      ctx.fillStyle = '#111';
      ctx.fillRect(-runnerSize * 0.2, -runnerSize * 0.4, runnerSize * 0.12, runnerSize * 0.4);
      ctx.fillRect(runnerSize * 0.08, -runnerSize * 0.4, runnerSize * 0.12, runnerSize * 0.4);

      // 胴体
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.roundRect(-runnerSize * 0.3, -runnerSize * 0.9, runnerSize * 0.6, runnerSize * 0.55, 8);
      ctx.fill();

      // 頭
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(0, -runnerSize * 1.05, runnerSize * 0.18, 0, Math.PI * 2);
      ctx.fill();

      // ボール
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.ellipse(-runnerSize * 0.15, -runnerSize * 0.7, runnerSize * 0.15, runnerSize * 0.1, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 【レイアウト修正】残距離（メートル表示）を相手選手と被らない画面下側にすっきり配置
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 4;
      ctx.fillText(`残距離: ${distance.toFixed(2)} m`, vpX, height - 80);
      ctx.shadowBlur = 0;
    }
  }

  function loop(now) {
    update(now);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>

</body>
</html>
